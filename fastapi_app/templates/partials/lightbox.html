<!-- Lightbox Modal -->
<div id="lightbox-modal"
    class="fixed inset-0 z-[9999] bg-black/95 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">

    <!-- Close Button -->
    <button id="lightbox-close"
        class="absolute top-4 right-4 text-white/70 hover:text-white transition-colors p-2 z-50 rounded-full hover:bg-white/10">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>

    <!-- Navigation Buttons -->
    <button id="lightbox-prev"
        class="absolute left-4 top-1/2 -translate-y-1/2 text-white/50 hover:text-white transition-all p-4 z-50 hover:bg-white/10 rounded-full">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
    </button>
    <button id="lightbox-next"
        class="absolute right-4 top-1/2 -translate-y-1/2 text-white/50 hover:text-white transition-all p-4 z-50 hover:bg-white/10 rounded-full">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
    </button>

    <!-- Image Container -->
    <div class="relative max-w-7xl max-h-screen w-full flex flex-col items-center justify-center pointer-events-none">
        <div id="lightbox-img-wrapper" class="relative group pointer-events-auto">
            <img id="lightbox-img" src="" alt="Full screen view"
                class="max-w-full max-h-[75vh] object-contain rounded-lg shadow-2xl transition-all duration-300 selection:bg-none" />
            
            <!-- Rotation Controls Overlay (Visible on hover or when rotated) -->
            <div id="rotation-controls" class="absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-2 bg-black/60 backdrop-blur-md px-4 py-2 rounded-full border border-white/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-auto">
                <button onclick="rotateImage(-90)" class="text-white/80 hover:text-white p-1" title="Rotate Left">
                    <span class="material-icons">rotate_left</span>
                </button>
                <button onclick="rotateImage(90)" class="text-white/80 hover:text-white p-1" title="Rotate Right">
                    <span class="material-icons">rotate_right</span>
                </button>
                <button onclick="rotateImage(180)" class="text-white/80 hover:text-white p-1" title="Flip 180">
                    <span class="material-icons">flip_camera_android</span>
                </button>
                <div class="w-px h-4 bg-white/20 mx-1"></div>
                <button id="save-rotation-btn" onclick="saveRotation()" class="text-white hover:text-green-400 p-1 flex items-center gap-1 text-xs font-bold" title="Save to R2">
                    <span class="material-icons text-sm">save</span>
                    SAVE
                </button>
            </div>
        </div>

        <!-- Caption -->
        <div id="lightbox-caption"
            class="mt-4 text-white/90 text-center font-display text-lg tracking-wide hidden pointer-events-auto"></div>
        
        <!-- Status Message -->
        <div id="rotate-status" class="mt-2 text-white/60 text-xs font-medium animate-pulse hidden">Saving to R2...</div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const modal = document.getElementById('lightbox-modal');
        const modalImg = document.getElementById('lightbox-img');
        const captionText = document.getElementById('lightbox-caption');
        const closeBtn = document.getElementById('lightbox-close');
        const prevBtn = document.getElementById('lightbox-prev');
        const nextBtn = document.getElementById('lightbox-next');

        let images = [];
        let currentIndex = 0;
        let currentRotation = 0;

        function refreshImageList() {
            // Selectors for gallery items, timeline photos, and memory content
            const selectors = [
                '.masonry-item img',           // Gallery grid
                'section img[data-alt]',       // Story/Timeline specific images using data-alt
                '.memory-content img',         // Generic memory content wrapper if exists
                'section img.object-cover',    // Broad selector for content images
                '.grid img',                   // Grid layouts in memory pages
                '.group img'                   // Common pattern for image wrappers
            ];

            const allCandidates = document.querySelectorAll(selectors.join(', '));
            images = Array.from(allCandidates).filter(img => {
                const isLogo = img.src.includes('logo') || img.classList.contains('icon');
                const isProfile = img.classList.contains('rounded-full') && img.width < 100;
                const isLightbox = img.id === 'lightbox-img';
                return !isLogo && !isProfile && !isLightbox;
            });
            console.log(`Lightbox: Refreshed image list, found ${images.length} candidates.`);
        }

        // Expose globally
        window.refreshLightboxImages = refreshImageList;

        // Global Click Listener (Event Delegation)
        document.addEventListener('click', (e) => {
            // 1. Ignore if lightbox is open and click is inside it (except close/nav handled separately)
            if (!modal.classList.contains('hidden') && modal.contains(e.target)) return;

            // 2. Find closest image or wrapper
            let targetImg = null;

            // Direct image click
            if (e.target.tagName === 'IMG') {
                targetImg = e.target;
            }
            // Wrapper/Overlay click - prioritize masonry items or common groups
            else {
                const wrapper = e.target.closest('.masonry-item, .group, .grid > div, .relative, [onclick*="openLightbox"]');
                if (wrapper) {
                    targetImg = wrapper.querySelector('img');
                }
            }

            // Check if it's one of our target lightbox images
            if (targetImg && !targetImg.id.includes('lightbox-img')) {
                // Ensure it's not a link or button
                if (e.target.closest('a:not([href="#"]), button')) return;

                // Sync image list if it doesn't contain this image yet (e.g. newly loaded)
                if (!images.includes(targetImg)) {
                    refreshImageList();
                }

                const index = images.indexOf(targetImg);
                if (index !== -1) {
                    e.preventDefault();
                    e.stopPropagation();
                    openLightbox(index);
                }
            }
        });

        // Listen for dynamic updates
        window.addEventListener('gallery-updated', () => {
            console.log("Lightbox: gallery-updated event received");
            refreshImageList();
        });

        function openLightbox(index) {
            currentIndex = index;
            updateLightboxContent();
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
            }, 10);
            document.body.classList.add('lightbox-open');
        }

        function closeLightbox() {
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                modalImg.src = '';
                currentRotation = 0;
                applyRotation();
            }, 300);
            document.body.classList.remove('lightbox-open');
        }

        function updateLightboxContent() {
            const img = images[currentIndex];
            if (!img) return;

            // Preload next
            const nextIndex = (currentIndex + 1) % images.length;
            const nextImg = new Image();
            nextImg.src = images[nextIndex].src;

            modalImg.style.opacity = '0.5';
            setTimeout(() => {
                modalImg.src = img.src;
                currentRotation = 0;
                applyRotation();
                
                const caption = img.getAttribute('data-alt') || img.alt;
                if (caption) {
                    captionText.textContent = caption;
                    captionText.classList.remove('hidden');
                } else {
                    captionText.classList.add('hidden');
                }
                modalImg.style.opacity = '1';
                modalImg.style.transform = 'scale(1)';
            }, 150);
        }

        function rotateImage(delta) {
            currentRotation = (currentRotation + delta) % 360;
            applyRotation();
        }

        function applyRotation() {
            modalImg.style.transform = `rotate(${currentRotation}deg)`;
            // Adjust margin if portrait-landscape swap
            const is90 = Math.abs(currentRotation % 180) === 90;
            modalImg.style.margin = is90 ? '40px 0' : '0';
        }

        async function saveRotation() {
            if (currentRotation === 0) return;
            
            const currentImg = images[currentIndex];
            const memoryId = currentImg.getAttribute('data-memory-id');
            const photoName = currentImg.getAttribute('data-photo-name');
            
            if (!memoryId || !photoName) {
                alert("Cannot save: missing photo metadata.");
                return;
            }

            const status = document.getElementById('rotate-status');
            const saveBtn = document.getElementById('save-rotation-btn');
            
            status.classList.remove('hidden', 'text-green-400', 'pointer-events-auto');
            status.classList.add('animate-pulse');
            status.textContent = "Saving to R2...";
            saveBtn.disabled = true;
            saveBtn.style.opacity = '0.5';

            try {
                // Backend expects the angle in PIL rotate terms. 
                // In PIL, rotate(90) is CCW. In CSS, rotate(90deg) is CW.
                // So we negate the angle for PIL if we want to match visual.
                const pilAngle = -currentRotation;

                const response = await fetch('/api/rotate-photo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        memory_id: parseInt(memoryId),
                        photo_name: photoName,
                        angle: pilAngle
                    })
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    status.classList.remove('animate-pulse');
                    status.classList.add('text-green-400', 'pointer-events-auto');
                    status.innerHTML = `Saved! Updating view... <button onclick="document.getElementById('rotate-status').classList.add('hidden')" class="ml-2 bg-green-500/20 px-2 py-0.5 rounded text-white hover:bg-green-500/40 transition">Close</button>`;
                    
                    // Force refresh image src with cache buster
                    const newUrl = new URL(modalImg.src);
                    newUrl.searchParams.set('v', Date.now());
                    modalImg.src = newUrl.toString();
                    
                    // Sync the source image too if visible
                    currentImg.src = newUrl.toString();
                    
                    // Reset rotation visual state, but keep the success notification visible
                    currentRotation = 0;
                    applyRotation();
                    saveBtn.disabled = false;
                    saveBtn.style.opacity = '1';
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                console.error(err);
                alert("Failed to save rotation: " + err.message);
                status.classList.add('hidden');
                saveBtn.disabled = false;
                saveBtn.style.opacity = '1';
            }
        }

        // Expose to window for onclick handlers
        window.rotateImage = rotateImage;
        window.saveRotation = saveRotation;

        function showNext() {
            currentIndex = (currentIndex + 1) % images.length;
            updateLightboxContent();
        }

        function showPrev() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateLightboxContent();
        }

        // Global trigger method
        window.openLightboxWithImage = function (imgEl) {
            if (!images.includes(imgEl)) refreshImageList();
            const index = images.indexOf(imgEl);
            if (index !== -1) openLightbox(index);
        };

        // Controls
        closeBtn.addEventListener('click', closeLightbox);
        nextBtn.addEventListener('click', (e) => { e.stopPropagation(); showNext(); });
        prevBtn.addEventListener('click', (e) => { e.stopPropagation(); showPrev(); });

        modal.addEventListener('click', (e) => {
            if (e.target.closest('#rotation-controls') || e.target.closest('#rotate-status')) return;
            if (e.target === modal || e.target.id === 'lightbox-modal' || e.target.classList.contains('flex')) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (modal.classList.contains('hidden')) return;
            switch (e.key) {
                case 'Escape': closeLightbox(); break;
                case 'ArrowRight': showNext(); break;
                case 'ArrowLeft': showPrev(); break;
            }
        });

        // Initialize
        refreshImageList();
        // Re-run on window load to catch lazy-loaded images
        window.addEventListener('load', refreshImageList);
    });
</script>
