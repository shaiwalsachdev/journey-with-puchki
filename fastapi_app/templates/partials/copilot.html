<!-- Memory Copilot Widget -->
<div id="copilot-widget" class="fixed {{ copilot_position | default('bottom-6 right-6') }} z-[99999] font-sans">
    
    <!-- Copilot Toggle Button -->
    <button id="copilot-toggle" class="bg-gradient-to-r from-primary to-rose-500 text-white rounded-full p-4 shadow-2xl hover:scale-110 transition-transform duration-300 focus:outline-none flex items-center justify-center relative overflow-hidden group">
        <span class="material-icons animate-pulse">auto_awesome</span>
        <!-- Sparkle effect -->
        <div class="absolute inset-0 bg-white/20 scale-0 group-hover:scale-150 rounded-full transition-transform duration-500"></div>
    </button>

    <!-- Copilot Chat Window -->
    <div id="copilot-window" class="hidden opacity-0 scale-0 translate-y-10 absolute bottom-20 right-0 w-[350px] sm:w-[400px] h-[550px] max-h-[80vh] min-h-[200px] min-w-[250px] bg-white/90 dark:bg-background-dark/95 backdrop-blur-xl rounded-2xl shadow-2xl border border-primary/20 flex flex-col overflow-hidden transition-all duration-300 origin-bottom-right">
        
        <!-- Resize Handles -->
        <div class="resizer resizer-top absolute top-0 left-0 w-full h-2 cursor-n-resize z-50"></div>
        <div class="resizer resizer-right absolute top-0 right-0 w-2 h-full cursor-e-resize z-50"></div>
        <div class="resizer resizer-bottom absolute bottom-0 left-0 w-full h-2 cursor-s-resize z-50"></div>
        <div class="resizer resizer-left absolute top-0 left-0 w-2 h-full cursor-w-resize z-50"></div>
        <div class="resizer resizer-top-left absolute top-0 left-0 w-4 h-4 cursor-nw-resize z-50"></div>
        <div class="resizer resizer-top-right absolute top-0 right-0 w-4 h-4 cursor-ne-resize z-50"></div>
        <div class="resizer resizer-bottom-left absolute bottom-0 left-0 w-4 h-4 cursor-sw-resize z-50"></div>
        <div class="resizer resizer-bottom-right absolute bottom-0 right-0 w-4 h-4 cursor-se-resize z-50"></div>
        
        <!-- Header -->
        <div id="copilot-header" class="cursor-move bg-gradient-to-r from-primary/10 to-rose-500/10 dark:from-primary/20 dark:to-rose-500/20 p-4 border-b border-primary/20 flex justify-between items-center select-none">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary to-rose-400 p-0.5 shadow-md">
                    <div class="w-full h-full bg-white dark:bg-background-dark rounded-full flex items-center justify-center overflow-hidden">
                        <img src="/static/images/kiara_avatar.png" class="w-full h-full object-cover">
                    </div>
                </div>
                <div>
                    <h3 class="font-bold text-lg tracking-wide drop-shadow-sm flex items-center gap-2">
                        Kiara
                        <div id="copilot-status-dot" class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)] animate-pulse hidden"></div>
                    </h3>
                    <p class="text-[10px] text-green-500 font-bold tracking-wider uppercase flex items-center gap-1">
                        <span id="copilot-voice-status">Online</span>
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="copilot-new-chat" class="text-xs font-bold text-rose-500 bg-white/50 dark:bg-black/20 hover:bg-white dark:hover:bg-black/50 px-2 py-1 rounded-md transition-colors flex items-center" title="Start a New Chat">
                    <span class="material-icons text-[14px] mr-1">refresh</span>New
                </button>
                <button id="copilot-minimize" class="text-gray-400 hover:text-gray-600 dark:hover:text-white transition-colors flex items-center" title="Minimize Window">
                    <span class="material-icons" id="copilot-minimize-icon">remove</span>
                </button>
                <button id="copilot-expand" class="text-gray-400 hover:text-gray-600 dark:hover:text-white transition-colors flex items-center" title="Expand Window">
                    <span class="material-icons" id="copilot-expand-icon">open_in_full</span>
                </button>
                <button id="copilot-close" class="text-gray-400 hover:text-gray-600 dark:hover:text-white transition-colors flex items-center">
                    <span class="material-icons">close</span>
                </button>
            </div>
        </div>

        <!-- Chat Area -->
        <div id="copilot-messages" class="flex-1 overflow-y-auto p-4 space-y-4 scroll-smooth">
            <!-- Welcome Message -->
            <div class="flex gap-2">
                <img src="/static/images/kiara_avatar.png" alt="Kiara" class="w-8 h-8 rounded-full object-cover flex-shrink-0 border border-gray-200 dark:border-gray-700 shadow-sm">
                <div class="bg-gray-100 dark:bg-gray-800 rounded-2xl rounded-tl-none p-3 max-w-[85%] text-sm text-gray-800 dark:text-gray-200 shadow-sm border border-gray-200 dark:border-gray-700">
                    Hi! I'm Kiara. Ask me about your dates, ask for a love poem, or let me analyze your memories! Try:
                    <div class="mt-2 space-y-1">
                        <button class="suggestion-btn text-primary text-xs text-left hover:underline w-full">"When was our Kokoy Cafe date?"</button>
                        <button class="suggestion-btn text-primary text-xs text-left hover:underline w-full">"Write a short poem about us"</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div id="copilot-typing" class="hidden p-4 pt-0">
            <div class="flex gap-2 items-center text-gray-400 text-xs font-medium">
                <span class="material-icons text-[16px] animate-spin">autorenew</span>
                <span>Copilot is thinking...</span>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-3 bg-gray-50 dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800">
            <form id="copilot-form" class="relative flex items-center gap-2">
                <textarea id="copilot-input" 
                    class="w-full bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 text-gray-900 dark:text-white rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-transparent resize-none min-h-[44px] max-h-[120px]" 
                    placeholder="Message Kiara..." 
                    rows="1"></textarea>
                
                <button id="copilot-voice-btn" type="button" class="w-10 h-10 rounded-full flex items-center justify-center bg-gray-100 dark:bg-gray-800 text-gray-500 hover:text-emerald-500 transition-colors flex-shrink-0 relative overflow-hidden group">
                    <span class="material-icons" id="copilot-voice-icon">mic_none</span>
                    <div id="copilot-voice-ripple" class="absolute inset-0 bg-emerald-500/20 rounded-full scale-0 transition-transform duration-300"></div>
                </button>

                <button type="submit" class="w-10 h-10 rounded-full bg-primary hover:bg-[#a00d3f] text-white flex items-center justify-center transition-colors shadow-md disabled:opacity-50 disabled:cursor-not-allowed flex-shrink-0" id="copilot-send-btn">
                    <span class="material-icons text-sm">send</span>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Move widget to document.body to escape any overflow:hidden containers
    const widget = document.getElementById('copilot-widget');
    if (widget && widget.parentElement !== document.body) {
        document.body.appendChild(widget);
    }

    const toggleBtn = document.getElementById('copilot-toggle');
    const closeBtn = document.getElementById('copilot-close');
    const minimizeBtn = document.getElementById('copilot-minimize');
    const minimizeIcon = document.getElementById('copilot-minimize-icon');
    const expandBtn = document.getElementById('copilot-expand');
    const expandIcon = document.getElementById('copilot-expand-icon');
    const newChatBtn = document.getElementById('copilot-new-chat');
    const windowEl = document.getElementById('copilot-window');
    const form = document.getElementById('copilot-form');
    const input = document.getElementById('copilot-input');
    const messagesEl = document.getElementById('copilot-messages');
    const typingIndicator = document.getElementById('copilot-typing');
    const sendBtn = document.getElementById('copilot-send-btn');
    const suggestions = document.querySelectorAll('.suggestion-btn');
    const welcomeMsgHTML = messagesEl.innerHTML; // Save welcome message HTML

    let chatHistory = JSON.parse(localStorage.getItem('copilot_chat_history') || '[]');

    function saveHistory() {
        localStorage.setItem('copilot_chat_history', JSON.stringify(chatHistory));
    }

    // Toggle Window with Animation
    function toggleCopilot() {
        if (windowEl.classList.contains('hidden') || windowEl.classList.contains('opacity-0')) {
            windowEl.classList.remove('hidden');
            // Small delay to allow display block to apply before transition
            requestAnimationFrame(() => {
                windowEl.style.transition = 'all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                windowEl.classList.remove('opacity-0', 'scale-0', 'translate-y-10');
                windowEl.classList.add('opacity-100', 'scale-100', 'translate-y-0');
            });
            setTimeout(() => {
                input.focus();
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }, 300);
        } else {
            windowEl.style.transition = 'all 0.3s ease-in';
            windowEl.classList.remove('opacity-100', 'scale-100', 'translate-y-0');
            windowEl.classList.add('opacity-0', 'scale-0', 'translate-y-10');
            
            // If it was dragged/maximized, reset position so it goes back to bottom right icon properly
            if (windowEl.style.position === 'fixed') {
                windowEl.style.position = 'absolute';
                windowEl.style.bottom = '5rem'; // bottom-20
                windowEl.style.right = '0';
                windowEl.style.left = 'auto';
                windowEl.style.top = 'auto';
            }

            setTimeout(() => {
                windowEl.classList.add('hidden');
            }, 300);
        }
    }

    toggleBtn.addEventListener('click', toggleCopilot);
    closeBtn.addEventListener('click', toggleCopilot);
    minimizeBtn.addEventListener('click', toggleCopilot);



    // Expand Window
    function toggleExpand() {
        const isMaximized = windowEl.classList.contains('!fixed');
        if (!isMaximized) {
            windowEl.classList.add('!fixed', '!inset-4', '!w-auto', '!h-auto', '!max-h-none', 'z-[100000]', '!top-4', '!left-4');
            expandIcon.innerText = 'close_fullscreen';
        } else {
            windowEl.classList.remove('!fixed', '!inset-4', '!w-auto', '!h-auto', '!max-h-none', 'z-[100000]', '!top-4', '!left-4');
            expandIcon.innerText = 'open_in_full';
        }
        setTimeout(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }, 300);
    }
    expandBtn.addEventListener('click', toggleExpand);

    // Dragging Logic
    const header = document.getElementById('copilot-header');
    let isDragging = false;
    let startX, startY, initialLeft, initialTop;

    header.addEventListener('mousedown', (e) => {
        if(e.target.closest('button')) return; // Ignore buttons
        if(windowEl.classList.contains('!fixed') && windowEl.classList.contains('!inset-4')) return; // Ignore if maximized
        
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        
        const rect = windowEl.getBoundingClientRect();
        windowEl.style.transition = 'none';
        windowEl.style.position = 'fixed';
        windowEl.style.bottom = 'auto';
        windowEl.style.right = 'auto';
        windowEl.style.margin = '0';
        
        initialLeft = rect.left;
        initialTop = rect.top;
        
        windowEl.style.left = initialLeft + 'px';
        windowEl.style.top = initialTop + 'px';
        
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
    });

    function onMouseMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        windowEl.style.left = (initialLeft + dx) + 'px';
        windowEl.style.top = (initialTop + dy) + 'px';
    }

    function onMouseUp() {
        isDragging = false;
        setTimeout(() => {
            windowEl.style.transition = 'all 0.3s ease';
        }, 10);
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
    }

    // 4-Sided Resizing Logic
    const resizers = document.querySelectorAll('.resizer');
    let isResizing = false;
    let currentResizer;
    let resizeStartX, resizeStartY, resizeStartWidth, resizeStartHeight, resizeStartLeft, resizeStartTop;

    resizers.forEach(resizer => {
        resizer.addEventListener('mousedown', function(e) {
            e.preventDefault();
            if(windowEl.classList.contains('!fixed') && windowEl.classList.contains('!inset-4')) return;
            if(windowEl.classList.contains('copilot-minimized')) return;

            currentResizer = e.target;
            isResizing = true;
            resizeStartX = e.clientX;
            resizeStartY = e.clientY;
            
            const rect = windowEl.getBoundingClientRect();
            
            windowEl.style.transition = 'none';
            windowEl.style.position = 'fixed';
            windowEl.style.bottom = 'auto';
            windowEl.style.right = 'auto';
            windowEl.style.margin = '0';
            windowEl.style.maxHeight = 'none'; // allow stretching beyond 80vh
            
            resizeStartLeft = rect.left;
            resizeStartTop = rect.top;
            resizeStartWidth = rect.width;
            resizeStartHeight = rect.height;

            windowEl.style.left = resizeStartLeft + 'px';
            windowEl.style.top = resizeStartTop + 'px';
            windowEl.style.width = resizeStartWidth + 'px';
            windowEl.style.height = resizeStartHeight + 'px';

            document.addEventListener('mousemove', resizeWindow);
            document.addEventListener('mouseup', stopResize);
        });
    });

    function resizeWindow(e) {
        if (!isResizing) return;
        e.preventDefault();
        const dx = e.clientX - resizeStartX;
        const dy = e.clientY - resizeStartY;

        if (currentResizer.classList.contains('resizer-right') || currentResizer.classList.contains('resizer-bottom-right') || currentResizer.classList.contains('resizer-top-right')) {
            windowEl.style.width = resizeStartWidth + dx + 'px';
        }
        if (currentResizer.classList.contains('resizer-bottom') || currentResizer.classList.contains('resizer-bottom-right') || currentResizer.classList.contains('resizer-bottom-left')) {
            windowEl.style.height = resizeStartHeight + dy + 'px';
        }
        if (currentResizer.classList.contains('resizer-left') || currentResizer.classList.contains('resizer-bottom-left') || currentResizer.classList.contains('resizer-top-left')) {
            windowEl.style.width = resizeStartWidth - dx + 'px';
            windowEl.style.left = resizeStartLeft + dx + 'px';
        }
        if (currentResizer.classList.contains('resizer-top') || currentResizer.classList.contains('resizer-top-left') || currentResizer.classList.contains('resizer-top-right')) {
            windowEl.style.height = resizeStartHeight - dy + 'px';
            windowEl.style.top = resizeStartTop + dy + 'px';
        }
    }

    function stopResize() {
        isResizing = false;
        setTimeout(() => {
            windowEl.style.transition = 'all 0.3s ease';
        }, 10);
        document.removeEventListener('mousemove', resizeWindow);
        document.removeEventListener('mouseup', stopResize);
    }

    // New Chat
    newChatBtn.addEventListener('click', () => {
        chatHistory = [];
        saveHistory();
        messagesEl.innerHTML = welcomeMsgHTML;
        // re-bind suggestion buttons inside welcome message
        bindSuggestions();
    });

    // Parse simple markdown
    function parseMarkdown(text) {
        if (!text) return "";
        let html = text.trim();
        html = html.replace(/\n{3,}/g, '\n\n'); // Limit to max 2 newlines
        html = html.replace(/\[(.*?)\]\s*\((.*?)\)/g, '<a href="$2" class="text-emerald-600 dark:text-emerald-400 hover:text-emerald-700 dark:hover:text-emerald-300 underline">$1</a>');
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
        html = html.replace(/\n/g, '<br>');
        return html;
    }

    function addMessage(text, isUser = false) {
        if (!text) return;
        const div = document.createElement('div');
        div.className = `flex gap-2 ${isUser ? 'justify-end' : ''}`;
        
        const avatarHTML = isUser ? '' : `
            <img src="/static/images/kiara_avatar.png" alt="Kiara" class="w-8 h-8 rounded-full object-cover flex-shrink-0 border border-gray-200 dark:border-gray-700 shadow-sm">
        `;

        const parsedText = parseMarkdown(text);
        const bubbleHTML = `
            <div class="${isUser ? 'bg-primary text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200 border border-gray-200 dark:border-gray-700'} rounded-2xl ${isUser ? 'rounded-tr-none' : 'rounded-tl-none'} p-3 max-w-[85%] text-sm shadow-sm break-words">
                ${parsedText}
            </div>
        `;

        div.innerHTML = isUser ? bubbleHTML : avatarHTML + bubbleHTML;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addCards(cards) {
        if (!cards || cards.length === 0) return;

        const container = document.createElement('div');
        container.className = 'flex gap-2 overflow-x-auto pb-2 ml-10 max-w-[85%] snap-x';
        
        cards.forEach(card => {
            const cardEl = document.createElement('a');
            cardEl.href = card.link || '#';
            cardEl.className = 'flex-shrink-0 w-48 bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-md border border-gray-200 dark:border-gray-700 hover:scale-105 transition-transform duration-200 snap-center block';
            
            let imgHTML = '';
            if (card.image) {
                const r2_url = "{{ r2_url }}";
                const imgUrl = card.image.startsWith('http') ? card.image : `${r2_url}/${card.image}`;
                imgHTML = `<img src="${imgUrl}" class="w-full h-32 object-cover" onerror="this.style.display='none'">`;
            }

            cardEl.innerHTML = `
                ${imgHTML}
                <div class="p-2">
                    <h4 class="font-bold text-xs text-gray-900 dark:text-white line-clamp-2">${card.title}</h4>
                    <div class="flex items-center justify-between mt-1">
                        <span class="text-[10px] text-primary uppercase font-bold tracking-wider">${card.type}</span>
                        <span class="material-icons text-[14px] text-gray-400">arrow_forward</span>
                    </div>
                </div>
            `;
            container.appendChild(cardEl);
        });

        messagesEl.appendChild(container);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMetrics(metrics) {
        if (!metrics || metrics.length === 0) return;
        
        const container = document.createElement('div');
        container.className = 'grid grid-cols-2 gap-2 ml-10 max-w-[85%] mb-4';
        
        metrics.forEach(m => {
            container.innerHTML += `
                <div class="bg-primary/10 border border-primary/20 rounded-lg p-2 text-center">
                    <div class="text-xs text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1">${m.label}</div>
                    <div class="text-lg font-bold text-primary">${m.value}</div>
                </div>
            `;
        });
        
        messagesEl.appendChild(container);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderHistory() {
        chatHistory.forEach(msg => {
            if (msg.role === 'user') {
                addMessage(msg.content, true);
            } else if (msg.role === 'assistant') {
                addMessage(msg.content, false);
                if (msg.cards) addCards(msg.cards);
                if (msg.metrics) addMetrics(msg.metrics);
            }
        });
    }

    // Load initial history
    renderHistory();

    // Voice UI elements
    const voiceBtn = document.getElementById('copilot-voice-btn');
    const voiceIcon = document.getElementById('copilot-voice-icon');
    const voiceRipple = document.getElementById('copilot-voice-ripple');
    const voiceStatus = document.getElementById('copilot-voice-status');
    const statusDot = document.getElementById('copilot-status-dot');

    let voiceActive = false;
    let audioContext = null;
    let microphone = null;
    let processor = null;
    let stream = null;
    let nextAudioTime = 0;

    function setVoiceUIState(state) {
        if (state === 'inactive') {
            voiceIcon.innerText = 'mic_none';
            voiceBtn.classList.remove('text-rose-500');
            voiceBtn.classList.add('text-gray-500');
            voiceRipple.classList.replace('scale-150', 'scale-0');
            voiceRipple.classList.remove('animate-pulse');
            voiceStatus.innerText = 'Online';
            statusDot.classList.replace('bg-emerald-500', 'bg-green-500');
            statusDot.classList.replace('bg-rose-500', 'bg-green-500');
        } else if (state === 'connecting') {
            voiceStatus.innerText = "Connecting...";
            voiceIcon.innerText = 'hourglass_empty';
        } else if (state === 'active') {
            voiceStatus.innerText = "Listening...";
            voiceIcon.innerText = 'mic_off';
            voiceBtn.classList.remove('text-gray-500');
            voiceBtn.classList.add('text-rose-500');
            voiceRipple.classList.replace('scale-0', 'scale-150');
            voiceRipple.classList.add('animate-pulse');
            statusDot.classList.replace('bg-green-500', 'bg-emerald-500');
        }
    }

    async function startVoice() {
        if (voiceActive) return;
        voiceActive = true;
        setVoiceUIState('connecting');

        try {
            nextAudioTime = 0;
            stream = await navigator.mediaDevices.getUserMedia({ 
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                } 
            });
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            await audioContext.audioWorklet.addModule('/static/js/audio-worklet.js');
            
            microphone = audioContext.createMediaStreamSource(stream);
            processor = new AudioWorkletNode(audioContext, 'pcm-processor');
            
            microphone.connect(processor);
            processor.connect(audioContext.destination);

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${window.location.host}/ws/voice-chat`);
            window.kiaraWs = ws;
            
            ws.onopen = () => {
                setVoiceUIState('active');
                
                processor.port.onmessage = (e) => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        const floats = e.data; // Float32Array
                        const pcm16 = new Int16Array(floats.length);
                        for (let i = 0; i < floats.length; i++) {
                            const s = Math.max(-1, Math.min(1, floats[i]));
                            pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                        }
                        
                        let binary = '';
                        const bytes = new Uint8Array(pcm16.buffer);
                        const len = bytes.byteLength;
                        for (let i = 0; i < len; i++) { binary += String.fromCharCode(bytes[i]); }
                        const base64 = window.btoa(binary);
                        
                        const msg = { realtimeInput: { audio: { mimeType: "audio/pcm;rate=16000", data: base64 } } };
                        ws.send(JSON.stringify(msg));
                    }
                };
            };

            ws.onmessage = async (e) => {
                try {
                    if (e.data instanceof Blob) {
                        const arrayBuffer = await e.data.arrayBuffer();
                        const pcm16 = new Int16Array(arrayBuffer);
                        const audioBuffer = audioContext.createBuffer(1, pcm16.length, 24000); 
                        const channelData = audioBuffer.getChannelData(0);
                        for (let i = 0; i < pcm16.length; i++) { channelData[i] = pcm16[i] / 32768.0; }

                        const source = audioContext.createBufferSource();
                        source.buffer = audioBuffer;
                        source.connect(audioContext.destination);
                        
                        if (nextAudioTime < audioContext.currentTime) {
                            nextAudioTime = audioContext.currentTime;
                        }
                        source.start(nextAudioTime);
                        nextAudioTime += audioBuffer.duration;
                        
                        voiceStatus.innerText = "Kiara is speaking...";
                        statusDot.classList.replace('bg-emerald-500', 'bg-rose-500');
                        clearTimeout(window.kiaraSpeakTimeout);
                        window.kiaraSpeakTimeout = setTimeout(() => {
                            if(voiceActive) {
                                voiceStatus.innerText = "Listening...";
                                statusDot.classList.replace('bg-rose-500', 'bg-emerald-500');
                            }
                        }, 1000);
                    } else {
                        const data = JSON.parse(e.data);
                        if (data.type === "gemini" && data.text) {
                            addOrUpdateVoiceMessage(data.text, false);
                        } else if (data.type === "user" && data.text) {
                            addOrUpdateVoiceMessage(data.text, true);
                        } else if (data.type === "turn_complete" || data.type === "interrupted") {
                            sealVoiceMessages();
                        }
                    }
                } catch (err) {
                    console.error("WS Parse error:", err);
                }
            };

            ws.onclose = () => { stopVoice(); };
            
        } catch (err) {
            console.error("Voice start error:", err);
            voiceStatus.innerText = "Error: " + err.message;
            setTimeout(() => { stopVoice(); }, 2000);
        }
    }

    let activeVoiceUserId = null;
    let activeVoiceGeminiId = null;
    let activeVoiceUserText = "";
    let activeVoiceGeminiText = "";

    function addOrUpdateVoiceMessage(textDelta, isUser) {
        const activeId = isUser ? activeVoiceUserId : activeVoiceGeminiId;
        
        if (isUser) activeVoiceUserText += textDelta;
        else activeVoiceGeminiText += textDelta;
        
        const fullText = isUser ? activeVoiceUserText : activeVoiceGeminiText;
        const parsedText = parseMarkdown(fullText);

        if (activeId) {
            const bubble = document.getElementById(activeId);
            if (bubble) {
                bubble.innerHTML = parsedText;
                messagesEl.scrollTop = messagesEl.scrollHeight;
                
                for (let i = chatHistory.length - 1; i >= 0; i--) {
                    if (chatHistory[i].role === (isUser ? 'user' : 'assistant')) {
                        chatHistory[i].content = fullText;
                        saveHistory();
                        break;
                    }
                }
                return;
            }
        }
        
        const div = document.createElement('div');
        div.className = `flex gap-3 ${isUser ? 'flex-row-reverse' : ''} mb-4`;
        
        const avatarHTML = isUser ? '' : `
            <img src="/static/images/kiara_avatar.png" alt="Kiara" class="w-8 h-8 rounded-full object-cover flex-shrink-0 border border-gray-200 dark:border-gray-700 shadow-sm">
        `;

        const newId = 'voice-msg-' + Date.now();
        if (isUser) activeVoiceUserId = newId;
        else activeVoiceGeminiId = newId;

        const bubbleHTML = `
            <div id="${newId}" class="${isUser ? 'bg-primary text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200 border border-gray-200 dark:border-gray-700'} rounded-2xl ${isUser ? 'rounded-tr-none' : 'rounded-tl-none'} p-3 max-w-[85%] text-sm shadow-sm break-words">
                ${parsedText}
            </div>
        `;

        div.innerHTML = isUser ? bubbleHTML : avatarHTML + bubbleHTML;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        chatHistory.push({ role: isUser ? 'user' : 'assistant', content: fullText });
        saveHistory();
    }

    function sealVoiceMessages() {
        activeVoiceUserId = null;
        activeVoiceGeminiId = null;
        activeVoiceUserText = "";
        activeVoiceGeminiText = "";
    }

    function stopVoice() {
        voiceActive = false;
        if (window.kiaraWs) { window.kiaraWs.close(); window.kiaraWs = null; }
        if (processor) { processor.disconnect(); processor = null; }
        if (microphone) { microphone.disconnect(); microphone = null; }
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
        if (audioContext) { audioContext.close(); audioContext = null; }
        
        setVoiceUIState('inactive');
    }

    voiceBtn.addEventListener('click', () => {
        if (voiceActive) stopVoice();
        else startVoice();
    });

    async function handleSend(e) {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, true);
        chatHistory.push({ role: 'user', content: text });
        saveHistory();
        
        input.value = '';
        sendBtn.disabled = true;
        typingIndicator.classList.remove('hidden');
        messagesEl.scrollTop = messagesEl.scrollHeight;

        if (window.kiaraWs && window.kiaraWs.readyState === WebSocket.OPEN) {
            window.kiaraWs.send(JSON.stringify({
                realtimeInput: { text: text }
            }));
            typingIndicator.classList.add('hidden');
            sendBtn.disabled = false;
            return;
        }

        try {
            const res = await fetch('/api/agent/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: chatHistory })
            });

            const data = await res.json();
            typingIndicator.classList.add('hidden');
            
            chatHistory.push({
                role: 'assistant',
                content: data.text || "",
                cards: data.cards || [],
                metrics: data.metrics || []
            });
            saveHistory();

            if (data.text) addMessage(data.text, false);
            if (data.cards) addCards(data.cards);
            if (data.metrics) addMetrics(data.metrics);

        } catch (err) {
            typingIndicator.classList.add('hidden');
            addMessage("Oops! Something went wrong communicating with the AI magic. 😢", false);
        } finally {
            sendBtn.disabled = false;
        }
    }

    form.addEventListener('submit', handleSend);
    
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend(e);
        }
    });
    
    // Suggestions
    function bindSuggestions() {
        document.querySelectorAll('.suggestion-btn').forEach(btn => {
            // Remove old listeners by cloning
            const newBtn = btn.cloneNode(true);
            if (btn.parentNode) {
                btn.parentNode.replaceChild(newBtn, btn);
                newBtn.addEventListener('click', () => {
                    input.value = newBtn.innerText.replace(/"/g, '');
                    handleSend({ preventDefault: () => {} });
                });
            }
        });
    }
    bindSuggestions();

});
</script>
