<style>
    /* --- AI Magic Container --- */
    #ai-magic-container {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
        background-color: #000;
    }

    #ai-magic-container.active {
        opacity: 1;
        pointer-events: auto;
    }

    /* --- Image Layers --- */
    .ai-magic-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        will-change: transform, opacity;
        transition: opacity 1s ease-in-out;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #ai-magic-container.vintage-mode .ai-magic-layer {
        filter: grayscale(100%) sepia(40%) contrast(1.2) brightness(0.9) !important;
    }

    /* Crossfade is handled by simply adding .visible to opacity */
    .ai-magic-layer.visible {
        opacity: 1;
    }

    /* --- Progress Bar --- */
    #ai-magic-progress-bar {
        width: 0%;
        transition: width linear;
    }

    /* =========================================================================
   ONGOING ANIMATIONS (Keys)
   Applied continuously while the image is active.
   ========================================================================= */
    @keyframes ken-burns-in {
        0% {
            transform: scale(1);
        }

        100% {
            transform: scale(1.15);
        }
    }

    @keyframes ken-burns-out {
        0% {
            transform: scale(1.15);
        }

        100% {
            transform: scale(1);
        }
    }

    @keyframes pan-right {
        0% {
            transform: scale(1.1) translate(-2%, 0);
        }

        100% {
            transform: scale(1.1) translate(2%, 0);
        }
    }

    @keyframes pan-left {
        0% {
            transform: scale(1.1) translate(2%, 0);
        }

        100% {
            transform: scale(1.1) translate(-2%, 0);
        }
    }

    @keyframes pan-up {
        0% {
            transform: scale(1.1) translate(0, 2%);
        }

        100% {
            transform: scale(1.1) translate(0, -2%);
        }
    }

    @keyframes pan-down {
        0% {
            transform: scale(1.1) translate(0, -2%);
        }

        100% {
            transform: scale(1.1) translate(0, 2%);
        }
    }

    @keyframes gentle-rotate {
        0% {
            transform: scale(1.15) rotate(-2deg);
        }

        100% {
            transform: scale(1.15) rotate(2deg);
        }
    }

    .anim-zoom-in {
        animation: ken-burns-in 12s ease-out forwards;
    }

    .anim-zoom-out {
        animation: ken-burns-out 12s ease-out forwards;
    }

    .anim-pan-right {
        animation: pan-right 12s ease-in-out alternate infinite;
    }

    .anim-pan-left {
        animation: pan-left 12s ease-in-out alternate infinite;
    }

    .anim-pan-up {
        animation: pan-up 12s ease-in-out alternate infinite;
    }

    .anim-pan-down {
        animation: pan-down 12s ease-in-out alternate infinite;
    }

    .anim-rotate {
        animation: gentle-rotate 12s ease-in-out alternate infinite;
    }

    /* =========================================================================
   ENTRANCE TRANSITIONS (Keys)
   Applied right as the image becomes visible.
   ========================================================================= */
    /* Crossfade is handled by simply adding .visible to opacity */

    .trans-slide-up {
        animation: slide-up-enter 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes slide-up-enter {
        0% {
            transform: translateY(40px);
            opacity: 0;
        }

        100% {
            transform: translateY(0);
            opacity: 1;
        }
    }

    .trans-blur-drop {
        animation: blur-drop 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes blur-drop {
        0% {
            transform: scale(1.3);
            filter: blur(15px);
            opacity: 0;
        }

        100% {
            transform: scale(1);
            filter: blur(0px);
            opacity: 1;
        }
    }

    .trans-flip {
        animation: flip-enter 1s ease-out forwards;
        backface-visibility: hidden;
    }

    @keyframes flip-enter {
        0% {
            transform: perspective(1000px) rotateY(-90deg);
            opacity: 0;
        }

        100% {
            transform: perspective(1000px) rotateY(0deg);
            opacity: 1;
        }
    }

    .trans-spin-in {
        animation: spin-in 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes spin-in {
        0% {
            transform: scale(0) rotate(-180deg);
            opacity: 0;
        }

        100% {
            transform: scale(1) rotate(0deg);
            opacity: 1;
        }
    }

    .trans-dramatic-zoom {
        animation: dramatic-zoom 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes dramatic-zoom {
        0% {
            transform: scale(2);
            opacity: 0;
            filter: brightness(2) blur(5px);
        }

        100% {
            transform: scale(1);
            opacity: 1;
            filter: brightness(1) blur(0);
        }
    }

    .trans-slide-left {
        animation: slide-left-enter 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes slide-left-enter {
        0% {
            transform: translateX(50px);
            opacity: 0;
        }

        100% {
            transform: translateX(0);
            opacity: 1;
        }
    }

    /* Pause State Override */
    .paused .ai-magic-layer,
    .paused .magic-particle {
        animation-play-state: paused !important;
    }

    /* --- Overlays & UI --- */
    .ai-vignette {
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.8);
        pointer-events: none;
        z-index: 10;
    }

    /* --- Particles Base --- */
    .magic-particle {
        position: absolute;
        pointer-events: none;
        z-index: 5;
        /* Behind ui, above images */
        opacity: 0;
        will-change: transform, opacity;
        font-size: 2rem;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    @keyframes float-up-particle {
        0% {
            transform: translateY(100vh) rotate(0deg) scale(0.5);
            opacity: 0;
        }

        20% {
            opacity: var(--max-opacity, 0.6);
        }

        80% {
            opacity: var(--max-opacity, 0.6);
        }

        100% {
            transform: translateY(-20vh) rotate(var(--rot, 360deg)) scale(var(--scale, 1.2));
            opacity: 0;
        }
    }

    @keyframes burst-particle {
        0% {
            transform: translate(0, 0) scale(0);
            opacity: 1;
        }

        100% {
            transform: translate(var(--tx), var(--ty)) scale(1.5);
            opacity: 0;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // UI Elements
        const container = document.getElementById('ai-magic-container');
        const menuOverlay = document.getElementById('ai-magic-menu');
        const controlsOverlay = document.getElementById('ai-magic-controls');
        const layerA = document.getElementById('ai-magic-layer-a');
        const layerB = document.getElementById('ai-magic-layer-b');
        const progressBar = document.getElementById('ai-magic-progress-bar');
        const progressContainer = document.getElementById('ai-magic-progress-container');
        const titleEl = document.getElementById('ai-magic-title');
        const dateEl = document.getElementById('ai-magic-date');
        const typeEl = document.getElementById('ai-magic-type');
        const metaContainer = document.getElementById('ai-magic-meta-container');
        const statusIconWrapper = document.getElementById('ai-magic-status-icon');
        const statusIcon = statusIconWrapper.querySelector('.material-icons');
        const particleContainer = document.getElementById('ai-magic-particles');

        // Cinematic Overlays
        const shutterOverlay = document.getElementById('ai-magic-shutter');
        const filmBurnOverlay = document.getElementById('ai-magic-film-burn');
        const lightLeakOverlay = document.getElementById('ai-magic-light-leak');
        const titleCardOverlay = document.getElementById('ai-magic-title-card');
        const chapterTitleEl = document.getElementById('ai-magic-chapter-title');
        const chapterSubtitleEl = document.getElementById('ai-magic-chapter-subtitle');

        // Control Elements
        const btnClose = document.getElementById('ai-magic-close');
        const zonePrev = document.getElementById('ai-magic-prev-zone');
        const zoneNext = document.getElementById('ai-magic-next-zone');
        const zonePlayPause = document.getElementById('ai-magic-playpause-zone');
        const btnFavorite = document.getElementById('ai-magic-favorite-btn');
        const toastEl = document.getElementById('ai-magic-toast');

        // State
        let isActive = false;
        let isPlaying = true;
        let playlist = [];
        let currentIndex = -1;
        let activeLayer = 'a'; // 'a' or 'b'
        let currentVibe = 'surprise'; // surprise, vintage, calendar, love, collage
        let currentFavoriteLock = false;
        let currentPace = 'dynamic';

        window.setAiPace = function (pace) {
            currentPace = pace;
            // Update UI buttons
            ['slow', 'dynamic', 'fast'].forEach(p => {
                const btn = document.getElementById(`btn-pace-${p}`);
                if (p === pace) {
                    btn.className = "px-6 py-2 rounded-full bg-white text-black font-bold text-sm shadow-lg transition-all";
                } else {
                    btn.className = "px-6 py-2 rounded-full text-white/70 hover:text-white transition-all text-sm font-bold";
                }
            });
        };

        // Timing
        let currentDuration = 3500; // default ms
        let slideTimer = null;
        let progressStartTime = 0;
        let progressRaf = null;
        let particleInterval = null;

        // Optional: Reference to global music player
        const globalAudio = document.getElementById('global-theme-audio');
        let musicWasPlayingBefore = false;

        // --- Core Logic ---

        // --- Particle System ---
        const emojiSets = {
            romantic: ['💖', '💕', '✨', '🌹', '🥰', '🫶'],
            food: ['🍕', '🍔', '🍣', '🍦', '✨', '😋'],
            party: ['🎉', '🎈', '✨', '🥂', '🥳', '🎂'],
            nature: ['🌸', '🍃', '✨', '☀️', '🦋'],
            default: ['✨', '⭐', '💫', '🤍'],
            vintage: ['✨', '📽️', '🎞️', '🕰️']
        };

        function spawnParticle(type = 'default') {
            if (!isActive || !isPlaying) return;

            const emojiSet = emojiSets[type] || emojiSets.default;
            const emoji = emojiSet[Math.floor(Math.random() * emojiSet.length)];

            const pt = document.createElement('div');
            pt.className = 'magic-particle';
            pt.textContent = emoji;

            // Randomize placement and animation properties
            const startX = Math.random() * 100;
            const size = 1 + Math.random() * 2; // 1rem to 3rem
            const duration = 5 + Math.random() * 7; // 5s to 12s
            const rotation = (Math.random() - 0.5) * 360;
            const maxOp = 0.3 + Math.random() * 0.4;

            pt.style.left = `${startX}vw`;
            pt.style.fontSize = `${size}rem`;
            pt.style.setProperty('--rot', `${rotation}deg`);
            pt.style.setProperty('--scale', `${1 + Math.random()}`);
            pt.style.setProperty('--max-opacity', maxOp);

            // Sometimes spawn from click/center (burst), mostly float up
            if (Math.random() > 0.9) {
                pt.style.left = '50vw';
                pt.style.top = '50vh';
                pt.style.setProperty('--tx', `${(Math.random() - 0.5) * 50}vw`);
                pt.style.setProperty('--ty', `${(Math.random() - 0.5) * 50}vh`);
                pt.style.animation = `burst-particle ${duration / 2}s ease-out forwards`;
            } else {
                pt.style.animation = `float-up-particle ${duration}s linear forwards`;
            }

            particleContainer.appendChild(pt);

            // Cleanup
            setTimeout(() => {
                if (pt.parentNode) pt.remove();
            }, duration * 1000);
        }

        // --- Cinematic Transitions ---
        function triggerCinematicTransition() {
            if (currentVibe === 'vintage') {
                const rand = Math.random();
                if (rand > 0.6) {
                    // Flash film burn
                    filmBurnOverlay.classList.remove('hidden');
                    filmBurnOverlay.style.opacity = '1';
                    setTimeout(() => { filmBurnOverlay.style.opacity = '0'; }, 100);
                    setTimeout(() => { filmBurnOverlay.classList.add('hidden'); }, 300);
                } else if (rand > 0.3) {
                    // Light leak
                    lightLeakOverlay.classList.remove('hidden');
                    lightLeakOverlay.style.opacity = '1';
                    setTimeout(() => { lightLeakOverlay.style.opacity = '0'; }, 300);
                    setTimeout(() => { lightLeakOverlay.classList.add('hidden'); }, 800);
                } else {
                    // Shutter flash
                    shutterOverlay.classList.remove('hidden');
                    shutterOverlay.style.opacity = '0.8';
                    setTimeout(() => { shutterOverlay.style.opacity = '0'; }, 50);
                    setTimeout(() => { shutterOverlay.classList.add('hidden'); }, 200);
                }
            } else {
                // Occasional light leak for surprise mode
                if (Math.random() > 0.8) {
                    lightLeakOverlay.classList.remove('hidden');
                    lightLeakOverlay.style.opacity = '0.5';
                    setTimeout(() => { lightLeakOverlay.style.opacity = '0'; }, 300);
                    setTimeout(() => { lightLeakOverlay.classList.add('hidden'); }, 800);
                }
            }
        }

        // Expose start function globally so the main gallery page can call it
        window.startAiMagic = async function () {
            if (isActive) return;
            isActive = true;

            // Show Container with Menu
            container.classList.remove('hidden');
            menuOverlay.classList.remove('hidden');
            menuOverlay.style.opacity = '1';
            controlsOverlay.classList.add('hidden');
            progressContainer.classList.add('hidden');
            metaContainer.classList.add('hidden');
            btnFavorite.classList.add('hidden');

            // Force reflow
            void container.offsetWidth;
            container.classList.add('active');
            document.body.style.overflow = 'hidden'; // lock scroll

            // Reset state
            playlist = [];
            currentIndex = -1;
            isPlaying = true;
            window.lastMonthYear = null;
            container.classList.remove('vintage-mode');
            layerA.classList.remove('visible');
            layerB.classList.remove('visible');
            layerA.innerHTML = '';
            layerB.innerHTML = '';
        };

        // Triggered by selecting a vibe from the menu
        window.beginExperience = async function (vibe) {
            currentVibe = vibe;

            // Audio Logic - start when experience chosen
            if (globalAudio) {
                musicWasPlayingBefore = !globalAudio.paused;
                if (!musicWasPlayingBefore) {
                    globalAudio.play().catch(e => console.warn("AI Magic: Auto-play blocked by browser. User must interact."));
                    if (window.updateButtonState) window.updateButtonState(true);
                }
            }

            // Hide Menu, Show Controls & UI
            menuOverlay.style.opacity = '0';
            setTimeout(() => {
                menuOverlay.classList.add('hidden');
                controlsOverlay.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                metaContainer.classList.remove('hidden');
                btnFavorite.classList.remove('hidden');
            }, 500);

            // Set vintage class on container immediately
            if (currentVibe === 'vintage') {
                container.classList.add('vintage-mode');
            } else {
                container.classList.remove('vintage-mode');
            }

            titleEl.textContent = "Summoning Memories...";
            dateEl.textContent = "";
            typeEl.classList.add('hidden');

            await fetchMorePhotos(true);
            if (playlist.length > 0) {
                playNext();
            } else {
                titleEl.textContent = "No memories found. Add some photos first!";
            }
        };

        function stopAiMagic() {
            isActive = false;
            clearTimeout(slideTimer);
            clearInterval(particleInterval);

            container.classList.remove('active');
            setTimeout(() => {
                container.classList.add('hidden');
                progressBar.style.width = '0%';
                layerA.innerHTML = '';
                layerB.innerHTML = '';
                particleContainer.innerHTML = '';
            }, 500);

            document.body.style.overflow = ''; // unlock scroll

            // Revert audio if we started it
            if (globalAudio && !musicWasPlayingBefore && !globalAudio.paused) {
                globalAudio.pause();
                if (window.updateButtonState) window.updateButtonState(false);
            }
        }

        async function fetchMorePhotos(initial = false) {
            try {
                // Different fetching strategies based on vibe
                let url = '';
                // Use the tag selector from the gallery page as the "vibe" category filter
                const category = window.currentCategory || 'all';

                if (currentVibe === 'calendar' || currentVibe === 'love') {
                    // For chronological modes, we fetch a large batch sorted
                    url = `/api/memories?page=1&limit=200&category=${category}`;
                } else {
                    // Random mixed modes
                    const seed = Math.floor(Math.random() * 1000000);
                    url = `/api/memories?page=1&limit=30&category=${category}&seed=${seed}`;
                }

                const response = await fetch(url);
                if (!response.ok) throw new Error("API failed");
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    let newItems = data.items;

                    if (currentVibe === 'calendar') {
                        // Sort oldest to newest
                        newItems.sort((a, b) => new Date(a.date) - new Date(b.date));
                    } else if (currentVibe === 'love') {
                        // Filter for romantic/milestone and sort oldest to newest, UNLESS the user picked a specific category
                        if (category === 'all') {
                            newItems = newItems.filter(p => p.type === 'milestone' || p.type === 'love' || p.title.toLowerCase().includes('love') || p.title.toLowerCase().includes('roka') || p.title.toLowerCase().includes('anniversary'));
                        }
                        if (newItems.length === 0) newItems = data.items; // Fallback
                        newItems.sort((a, b) => new Date(a.date) - new Date(b.date));
                    }

                    if (initial) {
                        playlist = newItems;
                    } else {
                        playlist.push(...newItems);
                    }
                    console.log(`AI Magic [${currentVibe} - ${category}]: Fetched ${newItems.length} photos.`);
                }
            } catch (error) {
                console.error("AI Magic failed to fetch:", error);
            }
        }

        function playNext() {
            if (!isActive || playlist.length === 0) return;

            currentIndex++;

            // If we are nearing the end of the playlist, fetch more proactively
            if (currentIndex >= playlist.length - 5) {
                fetchMorePhotos();
            }

            // If we still ran out (fetching failed or slow), loop back for now
            if (currentIndex >= playlist.length) {
                currentIndex = 0;
            }

            renderPhoto(currentIndex);
        }

        function playPrev() {
            if (!isActive || playlist.length === 0) return;

            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = 0; // Don't wrap backwards to unknown
                return;
            }
            renderPhoto(currentIndex);
        }

        function renderPhoto(index) {
            clearTimeout(slideTimer);
            cancelAnimationFrame(progressRaf);
            progressBar.style.transition = 'none';
            progressBar.style.width = '0%';

            const photo = playlist[index];
            if (!photo) return;

            // --- Chapter Card Logic ---
            let monthYear = '';
            if (photo.date) {
                const parts = photo.date.split(' ');
                if (parts.length >= 3) {
                    monthYear = `${parts[0]} ${parts[2]}`; // e.g., "January 2026"
                } else if (parts.length === 2 && photo.date.includes('-')) {
                    // Just in case it's "YYYY-MM"
                    monthYear = photo.date;
                }
            }

            if ((currentVibe === 'calendar' || currentVibe === 'love') && monthYear && monthYear !== window.lastMonthYear) {
                window.lastMonthYear = monthYear;

                // Show Chapter Card
                pauseTimers();

                titleCardOverlay.classList.remove('hidden');
                // Force reflow
                void titleCardOverlay.offsetWidth;

                titleCardOverlay.style.opacity = '1';
                chapterTitleEl.textContent = monthYear;
                chapterTitleEl.style.transform = 'translateY(0)';

                setTimeout(() => {
                    chapterSubtitleEl.textContent = currentVibe === 'love' ? "A Chapter of Our Journey" : "Memories";
                    chapterSubtitleEl.style.opacity = '1';
                }, 500);

                // Wait 2.5 seconds, fade out, then actually render photo
                setTimeout(() => {
                    titleCardOverlay.style.opacity = '0';
                    chapterTitleEl.style.transform = 'translateY(40px)';
                    chapterSubtitleEl.style.opacity = '0';
                    setTimeout(() => {
                        titleCardOverlay.classList.add('hidden');
                        renderPhotoCore(photo, index); // The actual render logic
                    }, 1000);
                }, 2500);
                return; // Stop here, render happens after card
            }

            renderPhotoCore(photo, index);
        }

        function renderPhotoCore(photo, index) {
            // Determine layers
            const nextLayerInfo = activeLayer === 'a' ? { active: layerB, hidden: layerA, name: 'b' } : { active: layerA, hidden: layerB, name: 'a' };

            // Determine if we should do a collage
            let isCollage = false;
            let collagePhotos = [photo];

            if (currentVibe === 'collage' || (currentVibe === 'surprise' && Math.random() > 0.8 && index < playlist.length - 2)) {
                isCollage = true;
                const count = Math.random() > 0.5 ? 2 : 3;
                for (let i = 1; i < count; i++) {
                    if (playlist[index + i]) {
                        collagePhotos.push(playlist[index + i]);
                    }
                }
                // Skip the next indices in the main playback
                currentIndex = index + collagePhotos.length - 1;
            }

            let loadedCount = 0;
            let hasError = false;

            const checkAllLoaded = () => {
                loadedCount++;
                if (loadedCount >= collagePhotos.length && !hasError) {
                    finalizeRender();
                }
            };

            const finalizeRender = () => {
                if (!isActive || currentIndex < index) return; // Stale check 

                // Build HTML
                let innerHTML = '';
                if (!isCollage || collagePhotos.length === 1) {
                    const imgUrl = `{{ r2_url }}/uploads/${collagePhotos[0].id}/${collagePhotos[0].photo}`;
                    innerHTML = `<img src="${imgUrl}" class="w-full h-full object-contain drop-shadow-2xl" />`;
                } else if (collagePhotos.length === 2) {
                    const url1 = `{{ r2_url }}/uploads/${collagePhotos[0].id}/${collagePhotos[0].photo}`;
                    const url2 = `{{ r2_url }}/uploads/${collagePhotos[1].id}/${collagePhotos[1].photo}`;
                    innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-8 w-full h-full p-8 md:p-16">
                        <div class="bg-cover bg-center rounded-2xl shadow-2xl border-4 border-white/10" style="background-image: url('${url1}')"></div>
                        <div class="bg-cover bg-center rounded-2xl shadow-2xl border-4 border-white/10" style="background-image: url('${url2}')"></div>
                    </div>`;
                } else if (collagePhotos.length === 3) {
                    const url1 = `{{ r2_url }}/uploads/${collagePhotos[0].id}/${collagePhotos[0].photo}`;
                    const url2 = `{{ r2_url }}/uploads/${collagePhotos[1].id}/${collagePhotos[1].photo}`;
                    const url3 = `{{ r2_url }}/uploads/${collagePhotos[2].id}/${collagePhotos[2].photo}`;
                    innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-8 w-full h-full p-8 md:p-16">
                        <div class="bg-cover bg-center rounded-2xl shadow-2xl border-4 border-white/10" style="background-image: url('${url1}')"></div>
                        <div class="grid grid-rows-2 gap-4 md:gap-8">
                            <div class="bg-cover bg-center shadow-2xl border-4 border-white/10" style="background-image: url('${url2}'); border-radius: 1rem 1rem 1rem 1rem;"></div>
                            <div class="bg-cover bg-top shadow-2xl border-4 border-white/10" style="background-image: url('${url3}'); border-radius: 1rem 1rem 1rem 1rem;"></div>
                        </div>
                    </div>`;
                }

                nextLayerInfo.active.innerHTML = innerHTML;

                // Apply randomized classes
                const transClasses = ['trans-slide-up', 'trans-blur-drop', 'trans-flip', 'trans-spin-in', 'trans-dramatic-zoom', 'trans-slide-left', ''];
                const animClasses = ['anim-zoom-in', 'anim-zoom-out', 'anim-pan-left', 'anim-pan-right', 'anim-pan-up', 'anim-pan-down', 'anim-rotate'];

                const randTrans = transClasses[Math.floor(Math.random() * transClasses.length)];
                let randAnim = animClasses[Math.floor(Math.random() * animClasses.length)];

                // If it's a collage, pan/zoom animations can slightly cut off edges, but that's fine since we have padding.
                if (isCollage && currentVibe === 'collage') {
                    // Less extreme animations for pure collage mode
                    randAnim = Math.random() > 0.5 ? 'anim-zoom-in' : 'anim-zoom-out';
                }

                // Trigger cinematic transition effect BEFORE swapping layers
                if (currentVibe !== 'surprise' && currentVibe !== 'calendar' && currentVibe !== 'collage') {
                    triggerCinematicTransition();
                } else if (Math.random() > 0.8) {
                    triggerCinematicTransition();
                }

                // Clear old classes
                nextLayerInfo.active.className = `ai-magic-layer ${nextLayerInfo.name === 'b' ? 'z-10' : 'z-0'}`;
                nextLayerInfo.hidden.className = `ai-magic-layer ${nextLayerInfo.name === 'a' ? 'z-10' : 'z-0'} visible`;

                // Force reflow before applying new classes
                void nextLayerInfo.active.offsetWidth;

                if (randTrans) nextLayerInfo.active.classList.add(randTrans);
                nextLayerInfo.active.classList.add(randAnim, 'visible');

                // Fade out previous layer after short delay
                setTimeout(() => {
                    nextLayerInfo.hidden.classList.remove('visible');
                    nextLayerInfo.hidden.innerHTML = ''; // Reclaim memory
                }, 1000);

                activeLayer = nextLayerInfo.name;

                // Update Metadata based on the primary photo in the collage
                const primaryPhoto = collagePhotos[0];
                if (isCollage && currentVibe === 'collage') {
                    // Combine titles, ensuring we handle empty strings gracefully and take unique titles if possible
                    const uniqueTitles = [...new Set(collagePhotos.map(p => p.title).filter(t => t))];
                    titleEl.textContent = uniqueTitles.join(', ');
                } else {
                    titleEl.textContent = primaryPhoto.title;
                }

                dateEl.textContent = primaryPhoto.date;
                if (primaryPhoto.type) {
                    typeEl.textContent = primaryPhoto.type;
                    typeEl.classList.remove('hidden');
                } else {
                    typeEl.classList.add('hidden');
                }

                // Update Favorite UI state
                const favIcon = btnFavorite.querySelector('.material-icons');
                if (primaryPhoto.is_favorite) {
                    favIcon.textContent = 'favorite';
                    btnFavorite.classList.add('text-red-500');
                } else {
                    favIcon.textContent = 'favorite_border';
                    btnFavorite.classList.remove('text-red-500');
                }

                let pType = 'default';
                const lowerTitle = primaryPhoto.title.toLowerCase();
                if (primaryPhoto.type === 'food' || lowerTitle.includes('food') || lowerTitle.includes('dinner') || lowerTitle.includes('lunch')) pType = 'food';
                else if (primaryPhoto.type === 'birthday' || lowerTitle.includes('party')) pType = 'party';
                else if (primaryPhoto.type === 'roka' || primaryPhoto.type === 'love' || lowerTitle.includes('love') || lowerTitle.includes('cute')) pType = 'romantic';
                if (currentVibe === 'vintage') pType = 'vintage';

                // Reel Pacing Logic
                if (isCollage) {
                    currentDuration = 3500 + Math.random() * 1000; // Give time to read collages (3.5s - 4.5s)
                    if (currentPace === 'slow') currentDuration += 2000;
                    if (currentPace === 'fast') currentDuration -= 1000;
                } else {
                    if (currentPace === 'dynamic') {
                        const isFastFlash = Math.random() < 0.3; // 30% chance to be a quick flash
                        if (isFastFlash) {
                            currentDuration = 800 + Math.random() * 1000; // 0.8s - 1.8s
                        } else {
                            currentDuration = 2500 + Math.random() * 2000; // 2.5s - 4.5s
                        }
                    } else if (currentPace === 'slow') {
                        currentDuration = 4500 + Math.random() * 2000; // 4.5s - 6.5s
                    } else if (currentPace === 'fast') {
                        currentDuration = 1000 + Math.random() * 800; // 1s - 1.8s
                    }
                }

                // Initial burst of particles for this theme
                for (let i = 0; i < (isCollage ? 6 : 3); i++) spawnParticle(pType);

                if (isPlaying) {
                    startTimers(pType);
                }
            };

            // Preload all needed images
            collagePhotos.forEach(p => {
                const preloader = new Image();
                preloader.onload = checkAllLoaded;
                preloader.onerror = () => {
                    hasError = true;
                    console.warn(`AI Magic: Failed to load image ${p.photo}`);
                    playNext();
                };
                preloader.src = `{{ r2_url }}/uploads/${p.id}/${p.photo}`;
            });
        }

        function startTimers(particleType = 'default') {
            container.classList.remove('paused');

            // Restart Progress Bar
            progressBar.style.transition = `width ${currentDuration}ms linear`;
            // Small timeout to ensure transition applies
            setTimeout(() => {
                if (isPlaying) progressBar.style.width = '100%';
            }, 50);

            // Setup continuous particles
            clearInterval(particleInterval);
            particleInterval = setInterval(() => {
                if (Math.random() > 0.4) spawnParticle(particleType);
            }, 400);

            slideTimer = setTimeout(() => {
                playNext();
            }, currentDuration);
        }

        function pauseTimers() {
            container.classList.add('paused');
            clearTimeout(slideTimer);
            clearInterval(particleInterval);

            // Compute current progress to freeze the bar visually
            const currentWidth = window.getComputedStyle(progressBar).width;
            progressBar.style.transition = 'none';
            progressBar.style.width = currentWidth;
        }

        function togglePlayPause() {
            isPlaying = !isPlaying;

            // Show indicator briefly
            statusIcon.textContent = isPlaying ? 'play_circle_filled' : 'pause_circle_filled';
            statusIconWrapper.classList.remove('text-white/0', 'scale-50');
            statusIconWrapper.classList.add('text-white', 'scale-100');

            setTimeout(() => {
                statusIconWrapper.classList.remove('text-white', 'scale-100');
                statusIconWrapper.classList.add('text-white/0', 'scale-50');
            }, 600);

            // Global Audio Pause sync
            if (globalAudio) {
                if (isPlaying) globalAudio.play().catch(e => console.log(e));
                else globalAudio.pause();
                if (window.updateButtonState) window.updateButtonState(isPlaying);
            }

            if (isPlaying) {
                // Restarting slide is easier for a smooth experience than dealing with complicated resume timers.
                // It feels magical when resumed anyway.
                const photo = playlist[currentIndex];
                let pType = 'default';
                if (photo) {
                    const lowerTitle = photo.title.toLowerCase();
                    if (photo.type === 'food' || lowerTitle.includes('food')) pType = 'food';
                    else if (photo.type === 'birthday' || lowerTitle.includes('party')) pType = 'party';
                    else if (photo.type === 'roka' || lowerTitle.includes('love')) pType = 'romantic';
                }

                progressBar.style.transition = 'none';
                progressBar.style.width = '0%';
                startTimers(pType);
            } else {
                pauseTimers();
            }
        }

        // --- Event Listeners ---
        btnClose.addEventListener('click', stopAiMagic);
        zonePrev.addEventListener('click', playPrev);
        zoneNext.addEventListener('click', playNext);
        zonePlayPause.addEventListener('click', togglePlayPause);

        let toastTimer;
        function showToast(message) {
            toastEl.textContent = message;
            toastEl.classList.remove('opacity-0', '-translate-y-4');
            toastEl.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastEl.classList.remove('opacity-100', 'translate-y-0');
                toastEl.classList.add('opacity-0', '-translate-y-4');
            }, 2000);
        }

        btnFavorite.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (currentFavoriteLock || !isActive || playlist.length === 0) return;

            const photo = playlist[currentIndex];
            // In a collage mode, this marks the *primary* photo as favorite. 
            if (!photo) return;

            currentFavoriteLock = true;

            try {
                const res = await fetch(`/api/memory/${photo.id}/favorite`, { method: 'POST' });
                const data = await res.json();

                if (data.status === 'success') {
                    // Update Local State so we remember if we play it again
                    photo.is_favorite = data.is_favorite;

                    // Update UI
                    const icon = btnFavorite.querySelector('.material-icons');
                    if (data.is_favorite) {
                        icon.textContent = 'favorite';
                        btnFavorite.classList.add('text-red-500');
                        showToast('❤️ Added to Favorites');
                        // Show quick particle burst
                        for (let i = 0; i < 3; i++) spawnParticle('romantic');
                    } else {
                        icon.textContent = 'favorite_border';
                        btnFavorite.classList.remove('text-red-500');
                        showToast('🤍 Removed from Favorites');
                    }
                }
            } catch (e) {
                console.error("Failed to favorite:", e);
                showToast('❌ Error updating favorite');
            } finally {
                currentFavoriteLock = false;
            }
        });

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (!isActive) return;
            switch (e.key) {
                case 'Escape': stopAiMagic(); break;
                case 'ArrowRight': playNext(); break;
                case 'ArrowLeft': playPrev(); break;
                case ' ': e.preventDefault(); togglePlayPause(); break;
            }
        });
    });
</script>
