<!-- DJ Kiara - Personal AI DJ Widget -->
<div id="dj-copilot-widget" class="fixed bottom-6 right-24 sm:right-28 z-[99999] font-sans">
    
    <!-- DJ Toggle & Floating Player Indicator -->
    <div class="relative flex items-center">
        <!-- Floating Track Pill (Visible when song is playing) -->
        <div id="dj-track-floating-pill" class="hidden mr-2 items-center gap-2 px-3 py-1.5 rounded-full bg-black/90 text-white backdrop-blur-xl border border-rose-500/40 shadow-xl max-w-[160px] sm:max-w-[220px] transition-all">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping shrink-0"></span>
            <div class="min-w-0 flex-1">
                <p id="dj-pill-track-title" class="text-[11px] font-bold truncate text-white">Song Title</p>
                <p id="dj-pill-track-artist" class="text-[9px] text-stone-400 truncate">Artist</p>
            </div>
            <!-- Quick Play / Pause Button directly on pill -->
            <button id="dj-pill-play-pause-btn" onclick="toggleGlobalDJPlayback(event)" class="w-6 h-6 rounded-full bg-gaana-red text-white flex items-center justify-center hover:scale-110 active:scale-95 transition-all shrink-0">
                <span class="material-icons text-[14px]" id="dj-pill-play-icon">play_arrow</span>
            </button>
        </div>

        <!-- DJ Toggle Button -->
        <button id="dj-toggle" onclick="window.toggleDJWindow(event)" class="cursor-pointer bg-gradient-to-r from-red-600 via-rose-600 to-amber-500 text-white rounded-full p-1.5 sm:p-2 shadow-2xl hover:scale-110 active:scale-95 transition-transform duration-300 focus:outline-none flex items-center justify-center relative overflow-hidden group border-2 border-amber-400/60 shrink-0 w-14 h-14 sm:w-16 sm:h-16 pointer-events-auto" title="DJ Kiara - ShaiX2 Personal AI DJ">
            <!-- Thinking aura ring around DJ toggle -->
            <div id="dj-toggle-thinking-ring" class="hidden absolute -inset-1 rounded-full bg-gradient-to-r from-amber-400 via-rose-500 to-purple-500 animate-spin blur-xs opacity-75"></div>
            
            <!-- DJ Kiara Avatar with vinyl border -->
            <div class="relative w-full h-full rounded-full overflow-hidden bg-black flex items-center justify-center border border-amber-300/40">
                <img src="/static/images/kiara_avatar.png" alt="DJ Kiara" class="w-full h-full object-cover">
                <!-- DJ Badge Overlay at bottom of avatar -->
                <div class="absolute bottom-0 inset-x-0 bg-black/75 text-[8px] sm:text-[9px] font-black text-amber-300 uppercase tracking-tight text-center py-0.5 leading-none shadow">
                    DJ KIARA
                </div>
            </div>

            <!-- Floating Headphones Badge -->
            <span class="material-icons text-[15px] sm:text-[16px] absolute top-1 right-1 text-amber-300 drop-shadow-md z-10 animate-bounce-slight">headphones</span>
            
            <!-- DJ Thinking badge -->
            <span id="dj-toggle-thinking-badge" class="hidden absolute -top-1 -left-1 w-5 h-5 rounded-full bg-amber-400 text-black text-[10px] font-black items-center justify-center animate-bounce z-20 shadow">💭</span>
            
            <!-- Equalizer bar indicator when song is playing -->
            <div id="dj-toggle-eq" class="hidden absolute bottom-3.5 inset-x-0 justify-center items-end gap-0.5 h-2.5 z-10 pointer-events-none">
                <span class="w-0.5 h-full bg-amber-300 rounded-full animate-pulse shadow"></span>
                <span class="w-0.5 h-2 bg-rose-300 rounded-full animate-pulse delay-75 shadow"></span>
                <span class="w-0.5 h-2.5 bg-amber-300 rounded-full animate-pulse delay-150 shadow"></span>
            </div>
            
            <!-- Wave Glow effect -->
            <div class="absolute inset-0 bg-white/20 scale-0 group-hover:scale-150 rounded-full transition-transform duration-500 z-10 pointer-events-none"></div>
        </button>
    </div>

    <!-- DJ Chat & Live Voice Window -->
    <div id="dj-window" class="hidden opacity-0 scale-0 translate-y-10 absolute bottom-20 right-0 w-[350px] sm:w-[410px] h-[580px] max-h-[85vh] min-h-[260px] min-w-[280px] bg-slate-950/95 text-white backdrop-blur-2xl rounded-3xl shadow-2xl border border-rose-500/30 flex flex-col overflow-hidden transition-all duration-300 origin-bottom-right z-[99999] pointer-events-auto">
        
        <!-- Header -->
        <div id="dj-header" class="cursor-move bg-gradient-to-r from-red-950/80 via-stone-900/90 to-black/90 p-4 border-b border-rose-500/20 flex justify-between items-center select-none shrink-0">
            <div class="flex items-center gap-3">
                <div class="relative w-11 h-11 rounded-full p-0.5 bg-gradient-to-tr from-amber-500 via-rose-500 to-red-600 shadow-lg shrink-0">
                    <div class="w-full h-full bg-black rounded-full flex items-center justify-center overflow-hidden relative">
                        <img src="/static/images/kiara_avatar.png" class="w-full h-full object-cover">
                        <!-- Tiny turntable overlay -->
                        <div class="absolute bottom-0 inset-x-0 bg-black/60 text-[8px] text-center font-extrabold text-amber-400 uppercase tracking-tighter">
                            DJ
                        </div>
                    </div>
                </div>
                <div>
                    <h3 class="font-extrabold text-base tracking-wide flex items-center gap-1.5 text-white">
                        <span>DJ Kiara</span>
                        <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30 uppercase tracking-wider">ShaiX2 DJ</span>
                        <div id="dj-status-dot" class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)] animate-pulse hidden"></div>
                    </h3>
                    <p class="text-[10px] text-amber-400 font-bold tracking-wider uppercase flex items-center gap-1">
                        <span class="inline-block w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></span>
                        <span id="dj-voice-status">On The Decks • Ready</span>
                    </p>
                </div>
            </div>

            <!-- Header Controls -->
            <div class="flex items-center gap-1.5">
                <button id="dj-new-chat" class="text-xs font-bold text-amber-400 bg-white/10 hover:bg-white/20 px-2 py-1 rounded-lg transition-colors flex items-center" title="Reset DJ Session">
                    <span class="material-icons text-[14px] mr-1">refresh</span>New
                </button>
                <button id="dj-close" class="p-1 rounded-lg text-stone-400 hover:text-white hover:bg-white/10 transition-colors flex items-center">
                    <span class="material-icons text-xl">close</span>
                </button>
            </div>
        </div>

        <!-- Turntable Visualizer Strip (Shows when track is being queued/played) -->
        <div id="dj-turntable-strip" class="hidden bg-black/60 border-b border-white/5 px-4 py-2 items-center justify-between gap-3 shrink-0">
            <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-7 h-7 rounded-full cd-vinyl flex items-center justify-center shrink-0 border border-white/20">
                    <img id="dj-strip-img" src="https://img.youtube.com/vi/N7jDUBRVQVA/hqdefault.jpg" class="w-4 h-4 rounded-full object-cover">
                </div>
                <div class="min-w-0">
                    <p id="dj-strip-status" class="text-[9px] uppercase tracking-wider text-emerald-400 font-extrabold truncate flex items-center gap-1">
                        <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span>Currently Playing</span>
                    </p>
                    <p id="dj-strip-title" class="text-xs font-bold text-white truncate"></p>
                </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <div id="dj-strip-eq" class="flex items-center gap-0.5 h-3 shrink-0">
                    <span class="w-0.5 h-full bg-gaana-red rounded-full animate-pulse"></span>
                    <span class="w-0.5 h-2 bg-amber-400 rounded-full animate-pulse delay-75"></span>
                    <span class="w-0.5 h-3 bg-rose-500 rounded-full animate-pulse delay-150"></span>
                </div>
                <button id="dj-strip-play-btn" onclick="toggleGlobalDJPlayback(event)" class="w-6 h-6 rounded-full bg-gaana-red hover:scale-110 active:scale-95 text-white flex items-center justify-center transition-all shadow" title="Play / Pause">
                    <span class="material-icons text-sm" id="dj-strip-play-icon">pause</span>
                </button>
                <button id="dj-next-btn" onclick="playNextGlobalSong(event)" class="w-6 h-6 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-all" title="Skip to Next Track">
                    <span class="material-icons text-sm">skip_next</span>
                </button>
            </div>
        </div>

        <!-- Chat Messages Container -->
        <div id="dj-messages" class="flex-1 overflow-y-auto p-4 space-y-3.5 scroll-smooth custom-scrollbar">
            <!-- Welcome Message -->
            <div class="flex gap-2.5">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-500 to-rose-600 p-0.5 shrink-0 shadow">
                    <img src="/static/images/kiara_avatar.png" alt="DJ Kiara" class="w-full h-full rounded-full object-cover">
                </div>
                <div class="bg-white/10 backdrop-blur-md rounded-2xl rounded-tl-none p-3.5 max-w-[85%] text-xs text-stone-200 shadow border border-white/10 leading-relaxed">
                    <p class="font-bold text-amber-300 mb-1">🎧 What's good Shai & Puchki! I'm DJ Kiara.</p>
                    <p>Tell me what you're feeling, ask for a song by name (e.g. <i>"Play Ye Tune Kya Kiya"</i>), or ask for a mood! Try tapping:</p>
                    <div class="mt-2.5 space-y-1.5">
                        <button class="dj-suggestion-btn w-full text-left px-2.5 py-1.5 rounded-xl bg-white/5 hover:bg-rose-500/20 text-rose-300 font-semibold border border-white/5 hover:border-rose-500/30 transition-all flex items-center justify-between">
                            <span>"Drop something deeply romantic"</span>
                            <span class="material-icons text-xs">play_arrow</span>
                        </button>
                        <button class="dj-suggestion-btn w-full text-left px-2.5 py-1.5 rounded-xl bg-white/5 hover:bg-rose-500/20 text-rose-300 font-semibold border border-white/5 hover:border-rose-500/30 transition-all flex items-center justify-between">
                            <span>"Play Ye Tune Kya Kiya"</span>
                            <span class="material-icons text-xs">play_arrow</span>
                        </button>
                        <button class="dj-suggestion-btn w-full text-left px-2.5 py-1.5 rounded-xl bg-white/5 hover:bg-rose-500/20 text-rose-300 font-semibold border border-white/5 hover:border-rose-500/30 transition-all flex items-center justify-between">
                            <span>"Give me energetic Punjabi beats"</span>
                            <span class="material-icons text-xs">play_arrow</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- DJ Thinking Indicator -->
        <div id="dj-typing" class="hidden p-3 pt-0">
            <div class="flex gap-2 items-center text-amber-400 text-xs font-semibold pl-10">
                <span class="material-icons text-sm animate-spin">sync</span>
                <span>DJ Kiara is scanning the vinyl records...</span>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-3 bg-black/80 border-t border-white/10 shrink-0">
            <form id="dj-form" class="relative flex items-center gap-2">
                <textarea id="dj-input" 
                    class="w-full bg-white/10 border border-white/15 text-white placeholder-stone-400 rounded-2xl px-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-rose-500/50 focus:border-transparent resize-none min-h-[40px] max-h-[100px]" 
                    placeholder="Tell DJ Kiara your mood or song name..." 
                    rows="1"></textarea>
                
                <!-- Live Voice DJ Button -->
                <button id="dj-voice-btn" type="button" class="w-10 h-10 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20 text-amber-400 hover:text-amber-300 transition-colors shrink-0 relative overflow-hidden group" title="Talk to DJ Kiara">
                    <span class="material-icons text-lg" id="dj-voice-icon">mic_none</span>
                    <div id="dj-voice-ripple" class="absolute inset-0 bg-rose-500/30 rounded-full scale-0 transition-transform duration-300"></div>
                </button>

                <!-- Submit Button -->
                <button type="submit" class="w-10 h-10 rounded-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white flex items-center justify-center transition-colors shadow-lg disabled:opacity-50 disabled:cursor-not-allowed shrink-0" id="dj-send-btn">
                    <span class="material-icons text-sm">send</span>
                </button>
            </form>
        </div>

    </div>
</div>

<script>
// Expose toggleDJWindow globally so onclick="window.toggleDJWindow(event)" works immediately
window.toggleDJWindow = function(event) {
    if (event) {
        event.stopPropagation();
    }
    const djWindow = document.getElementById('dj-window');
    if (!djWindow) return;

    if (djWindow.classList.contains('hidden') || djWindow.classList.contains('opacity-0')) {
        // Re-sync currently playing song whenever DJ window is opened
        try {
            const raw = localStorage.getItem('shaix2_current_song');
            if (raw && typeof window.updateDJPillUI === 'function') {
                const song = JSON.parse(raw);
                window.updateDJPillUI(song);
            }
        } catch(e) {}

        djWindow.classList.remove('hidden');
        requestAnimationFrame(() => {
            djWindow.classList.remove('opacity-0', 'scale-0', 'translate-y-10');
            djWindow.classList.add('opacity-100', 'scale-100', 'translate-y-0');
        });
        const djInput = document.getElementById('dj-input');
        setTimeout(() => djInput && djInput.focus(), 300);
    } else {
        djWindow.classList.remove('opacity-100', 'scale-100', 'translate-y-0');
        djWindow.classList.add('opacity-0', 'scale-0', 'translate-y-10');
        setTimeout(() => djWindow.classList.add('hidden'), 300);
    }
};

document.addEventListener('DOMContentLoaded', () => {
    // Append DJ widget to body to avoid container clipping
    const djWidget = document.getElementById('dj-copilot-widget');
    if (djWidget && djWidget.parentElement !== document.body) {
        document.body.appendChild(djWidget);
    }

    const djToggle = document.getElementById('dj-toggle');
    const djClose = document.getElementById('dj-close');
    const djNewChat = document.getElementById('dj-new-chat');
    const djWindow = document.getElementById('dj-window');
    const djForm = document.getElementById('dj-form');
    const djInput = document.getElementById('dj-input');
    const djMessages = document.getElementById('dj-messages');
    const djTyping = document.getElementById('dj-typing');
    const djSendBtn = document.getElementById('dj-send-btn');
    const djVoiceBtn = document.getElementById('dj-voice-btn');
    const djVoiceIcon = document.getElementById('dj-voice-icon');
    const djVoiceRipple = document.getElementById('dj-voice-ripple');
    const djVoiceStatus = document.getElementById('dj-voice-status');
    const djStatusDot = document.getElementById('dj-status-dot');
    const welcomeHTML = djMessages.innerHTML;

    let djChatHistory = JSON.parse(localStorage.getItem('dj_kiara_chat_history') || '[]');

    function saveDJHistory() {
        localStorage.setItem('dj_kiara_chat_history', JSON.stringify(djChatHistory));
    }

    if (djToggle) djToggle.addEventListener('click', window.toggleDJWindow);
    if (djClose) djClose.addEventListener('click', window.toggleDJWindow);

    if (djNewChat) {
        djNewChat.addEventListener('click', () => {
            djChatHistory = [];
            saveDJHistory();
            djMessages.innerHTML = welcomeHTML;
            bindDJSuggestions();
        });
    }

    function bindDJSuggestions() {
        document.querySelectorAll('.dj-suggestion-btn').forEach(btn => {
            btn.onclick = () => {
                const span = btn.querySelector('span');
                const text = span ? span.innerText.replace(/["\n]/g, '').trim() : btn.innerText.replace(/["\n]/g, '').trim();
                if (text && djInput) {
                    djInput.value = text;
                    djForm.requestSubmit ? djForm.requestSubmit() : djForm.dispatchEvent(new Event('submit'));
                }
            };
        });
    }
    bindDJSuggestions();

    function addDJMessage(text, isUser = false, song = null, choices = null) {
        if (!text && !song && (!choices || choices.length === 0)) return;
        const div = document.createElement('div');
        div.className = `flex gap-2.5 ${isUser ? 'justify-end' : ''}`;

        const avatarHTML = isUser ? '' : `
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-500 to-rose-600 p-0.5 shrink-0 shadow">
                <img src="/static/images/kiara_avatar.png" alt="DJ Kiara" class="w-full h-full rounded-full object-cover">
            </div>
        `;

        let songCardHTML = '';
        
        // 1. Multiple Choices List (When user asked for a mood, vibe, or help choosing)
        if (choices && Array.isArray(choices) && choices.length > 0) {
            songCardHTML += `
                <div class="mt-2.5 space-y-2">
                    <p class="text-[10px] font-extrabold uppercase tracking-wider text-amber-400 flex items-center gap-1">
                        <span class="material-icons text-xs">queue_music</span>
                        DJ KIARA'S PICKS • TAP TO PLAY:
                    </p>
                    <div class="space-y-1.5">
            `;
            choices.forEach((c, idx) => {
                if (!c || !c.id) return;
                const choiceCardId = 'dj-choice-' + Math.random().toString(36).substring(2, 9);
                songCardHTML += `
                    <div id="${choiceCardId}" class="p-2 rounded-xl bg-black/60 border border-white/10 hover:border-amber-500/50 flex items-center justify-between gap-2.5 transition-all group">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <div class="relative w-9 h-9 rounded-lg overflow-hidden shrink-0 shadow bg-stone-900 border border-white/5">
                                <img src="${c.thumbnail || 'https://img.youtube.com/vi/' + c.id + '/hqdefault.jpg'}" class="w-full h-full object-cover">
                            </div>
                            <div class="min-w-0 flex-1">
                                <h4 class="text-[11px] font-bold text-white truncate group-hover:text-amber-300">${c.title || 'Track'}</h4>
                                <p class="text-[9px] text-stone-400 truncate">${c.artist || 'Artist'}</p>
                            </div>
                        </div>
                        <button onclick="confirmAndPlayDJTrack('${choiceCardId}', '${c.id}', '${(c.title || '').replace(/'/g, "\\'")}', '${(c.artist || '').replace(/'/g, "\\'")}', '${(c.vibe || '').replace(/'/g, "\\'")}', '${c.thumbnail || ''}')"
                            class="px-2.5 py-1 rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-bold text-[10px] flex items-center gap-1 shadow shrink-0 active:scale-95 transition-all">
                            <span class="material-icons text-[12px]">play_arrow</span>Play
                        </button>
                    </div>
                `;
            });
            songCardHTML += `
                    </div>
                </div>
            `;
        }
        
        // 2. Exact Match Confirmation Card (When specific song was requested)
        else if (song && song.id) {
            const cardId = 'dj-confirm-' + Math.random().toString(36).substring(2, 9);
            songCardHTML = `
                <div id="${cardId}" class="mt-2.5 p-3 rounded-2xl bg-black/60 border border-amber-500/40 shadow-xl flex flex-col gap-2.5 transition-all">
                    <div class="flex items-center gap-3">
                        <div class="relative w-12 h-12 rounded-xl overflow-hidden shrink-0 shadow bg-stone-900 border border-white/10">
                            <img src="${song.thumbnail || 'https://img.youtube.com/vi/' + song.id + '/hqdefault.jpg'}" class="w-full h-full object-cover">
                        </div>
                        <div class="min-w-0 flex-1">
                            <span class="text-[9px] uppercase tracking-wider font-extrabold text-amber-400 flex items-center gap-1">
                                <span class="material-icons text-[11px]">headphones</span>
                                CONFIRM TRACK
                            </span>
                            <h4 class="text-xs font-bold text-white truncate">${song.title || 'Track'}</h4>
                            <p class="text-[10px] text-stone-400 truncate">${song.artist || 'Artist'}</p>
                        </div>
                    </div>

                    <!-- Confirmation Controls -->
                    <div class="flex items-center gap-2 pt-1 border-t border-white/10">
                        <button onclick="confirmAndPlayDJTrack('${cardId}', '${song.id}', '${(song.title || '').replace(/'/g, "\\'")}', '${(song.artist || '').replace(/'/g, "\\'")}', '${(song.vibe || '').replace(/'/g, "\\'")}', '${song.thumbnail || ''}')"
                            class="flex-1 py-1.5 px-3 rounded-xl bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-md hover:scale-[1.02] active:scale-95 transition-all">
                            <span class="material-icons text-xs">play_arrow</span>
                            <span>Play Now</span>
                        </button>
                        <button onclick="cancelDJTrack('${cardId}')"
                            class="py-1.5 px-3 rounded-xl bg-white/10 hover:bg-white/20 text-stone-300 font-semibold text-xs transition-all">
                            Cancel
                        </button>
                    </div>
                </div>
            `;
        }

        const bubbleHTML = `
            <div class="${isUser ? 'bg-gradient-to-r from-red-600 to-rose-600 text-white' : 'bg-white/10 text-stone-200 border border-white/10'} rounded-2xl ${isUser ? 'rounded-tr-none' : 'rounded-tl-none'} p-3 max-w-[85%] text-xs shadow-md leading-relaxed break-words">
                <div>${text ? text.replace(/\n/g, '<br>') : ''}</div>
                ${songCardHTML}
            </div>
        `;

        div.innerHTML = isUser ? bubbleHTML : avatarHTML + bubbleHTML;
        djMessages.appendChild(div);
        djMessages.scrollTop = djMessages.scrollHeight;
    }

    // Direct Song Play Helper from DJ Kiara
    window.playSongFromDJ = function(id, title, artist, vibe, thumbnail) {
        const payload = {
            id: id,
            title: title,
            artist: artist,
            vibe: vibe,
            thumbnail: thumbnail,
            isPlaying: true,
            updatedAt: Date.now()
        };

        // 1. If currently on /music page and selectSong function exists, trigger directly!
        if (typeof selectSong === 'function') {
            selectSong(id, title, artist, vibe, "Queued by DJ Kiara", thumbnail, "", true);
        } else {
            // 2. Play right here on the current page through global player!
            try {
                localStorage.setItem('shaix2_current_song', JSON.stringify(payload));
                localStorage.setItem('shaix2_song_time', '0');
            } catch(e) {}

            if (typeof window.syncGlobalMusicAudio === 'function') {
                window.syncGlobalMusicAudio();
            }
        }

        // Update Pill and Turntable Strip immediately
        updateDJPillUI(payload);
        const stripTitle = document.getElementById('dj-strip-title');
        const stripImg = document.getElementById('dj-strip-img');
        if (stripTitle) stripTitle.textContent = title;
        if (stripImg && thumbnail) stripImg.src = thumbnail;
    };

    // Confirmation Play Handlers
    window.confirmAndPlayDJTrack = function(cardId, id, title, artist, vibe, thumbnail) {
        // Change card to active playing state
        const card = document.getElementById(cardId);
        if (card) {
            card.classList.replace('border-amber-500/40', 'border-emerald-500/50');
            card.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="relative w-10 h-10 rounded-xl overflow-hidden shrink-0 shadow bg-stone-900 border border-emerald-500/40">
                        <img src="${thumbnail || 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg'}" class="w-full h-full object-cover">
                    </div>
                    <div class="min-w-0 flex-1">
                        <span class="text-[9px] uppercase tracking-wider font-extrabold text-emerald-400 flex items-center gap-1">
                            <span class="material-icons text-[11px] animate-pulse">volume_up</span>
                            NOW PLAYING
                        </span>
                        <h4 class="text-xs font-bold text-white truncate">${title}</h4>
                        <p class="text-[10px] text-stone-400 truncate">${artist}</p>
                    </div>
                </div>
            `;
        }
        playSongFromDJ(id, title, artist, vibe, thumbnail);
    };

    window.cancelDJTrack = function(cardId) {
        const card = document.getElementById(cardId);
        if (card) {
            card.innerHTML = `
                <div class="py-1 px-2 text-stone-400 text-[11px] italic flex items-center gap-1.5">
                    <span class="material-icons text-xs text-stone-500">block</span>
                    <span>Track skipped. Tell DJ Kiara what you want instead!</span>
                </div>
            `;
            setTimeout(() => {
                if (card) card.classList.add('opacity-50');
            }, 300);
        }
    };

    // Chat Submission
    if (djForm) {
        djForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = djInput.value.trim();
            if (!text) return;

            addDJMessage(text, true);
            djChatHistory.push({ role: 'user', content: text });
            saveDJHistory();

            djInput.value = '';
            djInput.style.height = 'auto';
            if (djTyping) djTyping.classList.remove('hidden');
            const thinkingRing = document.getElementById('dj-toggle-thinking-ring');
            const thinkingBadge = document.getElementById('dj-toggle-thinking-badge');
            if (thinkingRing) thinkingRing.classList.remove('hidden');
            if (thinkingBadge) thinkingBadge.classList.remove('hidden');

            try {
                const res = await fetch('/api/dj/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: djChatHistory })
                });

                if (djTyping) djTyping.classList.add('hidden');
                if (thinkingRing) thinkingRing.classList.add('hidden');
                if (thinkingBadge) thinkingBadge.classList.add('hidden');

                if (!res.ok) throw new Error("DJ Kiara is tuning the records...");
                const data = await res.json();

                const replyText = data.text || "Here is what I picked for your vibe!";
                const song = data.song;
                const choices = data.choices;

                // Add message with choices list or exact confirmation card
                addDJMessage(replyText, false, song, choices);
                djChatHistory.push({ role: 'assistant', content: replyText });
                saveDJHistory();

            } catch (err) {
                if (djTyping) djTyping.classList.add('hidden');
                if (thinkingRing) thinkingRing.classList.add('hidden');
                if (thinkingBadge) thinkingBadge.classList.add('hidden');
                addDJMessage("DJ Kiara: " + err.message, false);
            }
        });
    }

    // Auto-expand textarea
    if (djInput) {
        djInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
        djInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                djForm.dispatchEvent(new Event('submit'));
            }
        });
    }

    // --- DJ Live Voice Engine ---
    let djVoiceActive = false;
    let djAudioContext = null;
    let djStream = null;
    let djNextAudioTime = 0;

    function setDJVoiceUI(state) {
        if (state === 'inactive') {
            djVoiceIcon.innerText = 'mic_none';
            djVoiceBtn.classList.remove('text-rose-500');
            djVoiceBtn.classList.add('text-amber-400');
            djVoiceRipple.classList.replace('scale-150', 'scale-0');
            djVoiceRipple.classList.remove('animate-pulse');
            djVoiceStatus.innerText = "On The Decks • Ready";
            djStatusDot.classList.add('hidden');
        } else if (state === 'connecting') {
            djVoiceStatus.innerText = "Tuning Decks...";
            djVoiceIcon.innerText = 'hourglass_empty';
        } else if (state === 'active') {
            djVoiceStatus.innerText = "DJ Kiara Listening...";
            djVoiceIcon.innerText = 'mic_off';
            djVoiceBtn.classList.add('text-rose-500');
            djVoiceRipple.classList.replace('scale-0', 'scale-150');
            djVoiceRipple.classList.add('animate-pulse');
            djStatusDot.classList.remove('hidden');
        }
    }

    async function startDJVoice() {
        if (djVoiceActive) return;
        djVoiceActive = true;
        setDJVoiceUI('connecting');

        try {
            djNextAudioTime = 0;
            djStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
            });
            djAudioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            await djAudioContext.audioWorklet.addModule('/static/js/audio-worklet.js');

            const mic = djAudioContext.createMediaStreamSource(djStream);
            const processor = new AudioWorkletNode(djAudioContext, 'pcm-processor');
            mic.connect(processor);
            processor.connect(djAudioContext.destination);

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${window.location.host}/ws/dj-voice-chat`);
            window.djKiaraWs = ws;

            ws.onopen = () => {
                setDJVoiceUI('active');
                processor.port.onmessage = (e) => {
                    if (ws.readyState === WebSocket.OPEN) {
                        const pcm16 = e.data;
                        let binary = '';
                        const bytes = new Uint8Array(pcm16.buffer);
                        for (let i = 0; i < bytes.byteLength; i++) { binary += String.fromCharCode(bytes[i]); }
                        const base64 = btoa(binary);
                        ws.send(JSON.stringify({ realtimeInput: { audio: { mimeType: "audio/pcm;rate=16000", data: base64 } } }));
                    }
                };
            };

            ws.onmessage = async (e) => {
                try {
                    if (e.data instanceof Blob) {
                        const arrayBuffer = await e.data.arrayBuffer();
                        const pcm16 = new Int16Array(arrayBuffer);
                        const audioBuffer = djAudioContext.createBuffer(1, pcm16.length, 24000);
                        const channelData = audioBuffer.getChannelData(0);
                        for (let i = 0; i < pcm16.length; i++) { channelData[i] = pcm16[i] / 32768.0; }

                        const source = djAudioContext.createBufferSource();
                        source.buffer = audioBuffer;
                        source.connect(djAudioContext.destination);

                        if (djNextAudioTime < djAudioContext.currentTime) {
                            djNextAudioTime = djAudioContext.currentTime;
                        }
                        source.start(djNextAudioTime);
                        djNextAudioTime += audioBuffer.duration;

                        djVoiceStatus.innerText = "DJ Kiara on the mic...";
                    } else {
                        const data = JSON.parse(e.data);
                        if (data.type === "gemini" && data.text) {
                            addDJMessage(data.text, false);
                        } else if (data.type === "user" && data.text) {
                            addDJMessage(data.text, true);
                        }
                    }
                } catch(err) {
                    console.error("DJ voice parse error:", err);
                }
            };

            ws.onclose = () => stopDJVoice();

        } catch (err) {
            console.error("DJ Voice Start Error:", err);
            djVoiceStatus.innerText = "Mic Error: " + err.message;
            setTimeout(() => stopDJVoice(), 2000);
        }
    }

    function stopDJVoice() {
        if (!djVoiceActive) return;
        djVoiceActive = false;
        setDJVoiceUI('inactive');
        if (window.djKiaraWs) {
            window.djKiaraWs.close();
            window.djKiaraWs = null;
        }
        if (djStream) {
            djStream.getTracks().forEach(t => t.stop());
            djStream = null;
        }
        if (djAudioContext) {
            djAudioContext.close();
            djAudioContext = null;
        }
    }

    if (djVoiceBtn) {
        djVoiceBtn.addEventListener('click', () => {
            if (djVoiceActive) stopDJVoice();
            else startDJVoice();
        });
    }

    // --- Global DJ Pill & Playback Control (Merged with DJ Kiara) ---
    window.updateDJPillUI = function(songData) {
        const pill = document.getElementById('dj-track-floating-pill');
        const pillTitle = document.getElementById('dj-pill-track-title');
        const pillArtist = document.getElementById('dj-pill-track-artist');
        const pillIcon = document.getElementById('dj-pill-play-icon');
        const toggleEq = document.getElementById('dj-toggle-eq');
        const stripContainer = document.getElementById('dj-turntable-strip');

        if (!songData || !songData.id) {
            if (pill) {
                pill.classList.add('hidden');
                pill.classList.remove('flex');
            }
            if (stripContainer) {
                stripContainer.classList.add('hidden');
                stripContainer.classList.remove('flex');
            }
            if (toggleEq) toggleEq.classList.add('hidden');
            return;
        }

        // Show pill (only on non-music pages to avoid overlapping the bottom player bar)
        if (pill) {
            if (window.location.pathname.startsWith('/music')) {
                pill.classList.add('hidden');
                pill.classList.remove('flex');
            } else {
                pill.classList.remove('hidden');
                pill.classList.add('flex');
            }
        }
        if (pillTitle) pillTitle.textContent = songData.title || 'Playing Song';
        if (pillArtist) pillArtist.textContent = songData.artist || 'DJ Kiara';

        // Update Turntable Strip in DJ chat window
        const stripTitle = document.getElementById('dj-strip-title');
        const stripImg = document.getElementById('dj-strip-img');
        const stripStatus = document.getElementById('dj-strip-status');
        const stripEq = document.getElementById('dj-strip-eq');
        const stripPlayIcon = document.getElementById('dj-strip-play-icon');

        if (stripContainer) {
            stripContainer.classList.remove('hidden');
            stripContainer.classList.add('flex');
        }
        if (stripTitle) stripTitle.textContent = songData.title || 'Track';
        if (stripImg && songData.thumbnail) stripImg.src = songData.thumbnail;

        if (songData.isPlaying) {
            if (pillIcon) pillIcon.textContent = 'pause';
            if (stripPlayIcon) stripPlayIcon.textContent = 'pause';
            if (toggleEq) {
                toggleEq.classList.remove('hidden');
                toggleEq.classList.add('flex');
            }
            if (stripImg) stripImg.classList.add('animate-spin-slow');
            if (stripEq) stripEq.classList.remove('opacity-0');
            if (stripStatus) {
                stripStatus.className = "text-[9px] uppercase tracking-wider text-emerald-400 font-extrabold truncate flex items-center gap-1";
                stripStatus.innerHTML = `<span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span><span>Currently Playing</span>`;
            }
        } else {
            if (pillIcon) pillIcon.textContent = 'play_arrow';
            if (stripPlayIcon) stripPlayIcon.textContent = 'play_arrow';
            if (toggleEq) {
                toggleEq.classList.add('hidden');
                toggleEq.classList.remove('flex');
            }
            if (stripImg) stripImg.classList.remove('animate-spin-slow');
            if (stripEq) stripEq.classList.add('opacity-0');
            if (stripStatus) {
                stripStatus.className = "text-[9px] uppercase tracking-wider text-stone-400 font-extrabold truncate flex items-center gap-1";
                stripStatus.innerHTML = `<span class="inline-block w-1.5 h-1.5 rounded-full bg-stone-500"></span><span>Paused</span>`;
            }
        }
    };

    window.toggleGlobalDJPlayback = function(event) {
        if (event) event.stopPropagation();
        try {
            // 1. If on /music page, check if window.togglePlayPause is defined
            if (typeof window.togglePlayPause === 'function') {
                window.togglePlayPause();
                return;
            }
            if (typeof togglePlayPause === 'function') {
                togglePlayPause();
                return;
            }

            // 2. Fallback for non-music pages or before music script mounts
            const raw = localStorage.getItem('shaix2_current_song');
            if (!raw) return;
            const song = JSON.parse(raw);
            const newState = !song.isPlaying;
            song.isPlaying = newState;
            song.updatedAt = Date.now();
            localStorage.setItem('shaix2_current_song', JSON.stringify(song));

            // Notify same-tab listeners (such as music page if active)
            window.dispatchEvent(new CustomEvent('shaix2_song_state_changed', { detail: song }));

            if (window.globalYtPlayer) {
                if (newState && typeof window.globalYtPlayer.playVideo === 'function') {
                    window.globalYtPlayer.playVideo();
                } else if (!newState && typeof window.globalYtPlayer.pauseVideo === 'function') {
                    window.globalYtPlayer.pauseVideo();
                }
            } else if (typeof window.syncGlobalMusicAudio === 'function') {
                window.syncGlobalMusicAudio();
            }

            window.updateDJPillUI(song);
        } catch(e) {
            console.error("toggleGlobalDJPlayback error:", e);
        }
    };

    window.playNextGlobalSong = function(event) {
        if (event) event.stopPropagation();
        if (typeof window.playNextSong === 'function') {
            window.playNextSong();
            return;
        }
        if (typeof playNextSong === 'function') {
            playNextSong();
            return;
        }
        // If on another page, fetch music catalog or next track
        fetch('/api/music/sections')
            .then(res => res.json())
            .then(data => {
                const songs = [];
                (data.sections || []).forEach(sec => (sec.songs || []).forEach(s => songs.push(s)));
                if (songs.length === 0) return;
                const raw = localStorage.getItem('shaix2_current_song');
                let curId = '';
                if (raw) {
                    try { curId = JSON.parse(raw).id; } catch(e) {}
                }
                const idx = songs.findIndex(s => s.id === curId);
                const nextIdx = (idx + 1) % songs.length;
                const nextSong = songs[nextIdx];
                playSongFromDJ(nextSong.id, nextSong.title, nextSong.artist, nextSong.vibe, nextSong.thumbnail);
            })
            .catch(err => console.error("playNextGlobalSong error:", err));
    };

    // Listen for storage events (cross-tab / cross-page changes)
    window.addEventListener('storage', (e) => {
        if (e.key === 'shaix2_current_song') {
            try {
                const song = JSON.parse(e.newValue);
                updateDJPillUI(song);
            } catch(err) {}
        }
    });

    // Listen for same-window custom events
    window.addEventListener('shaix2_song_state_changed', (e) => {
        if (e.detail) {
            updateDJPillUI(e.detail);
        }
    });

    // Check initial song state on page load
    try {
        const raw = localStorage.getItem('shaix2_current_song');
        if (raw) {
            const song = JSON.parse(raw);
            updateDJPillUI(song);
        }
    } catch(err) {}
});
</script>
