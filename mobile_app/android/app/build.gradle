plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shaix2.journey'
    compileSdk 34

    defaultConfig {
        applicationId "com.shaix2.journey"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Android SDK WebView implementation - no bulky dependencies needed
}
